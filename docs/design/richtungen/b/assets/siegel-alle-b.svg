<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 18" width="80" height="36" aria-hidden="true" focusable="false">
  <!-- Heatmap-Siegel "Alle: Geht". Links hell (auf Indigo-Zelle #2B2266: Minze 8,7 : 1), rechts dunkel (auf Minze-Zelle) -->
