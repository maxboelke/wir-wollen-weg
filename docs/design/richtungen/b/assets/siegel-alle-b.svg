    <circle cx="9" cy="9" r="7.8" fill="#52E5B8" stroke="#FFFFFF" stroke-width="1.4"/>
    <path d="M5.5 9.3l2.3 2.3 4.6-4.9" fill="none" stroke="#2B2266" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
