<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ==========================================================================
   Design-Mockup: optische Varianten des Reise-Cockpits (W16, F-053) – KEIN Produktivcode.
   Verantwortlich: Designer · Stand 2026-10-22
   Werte aus docs/design/tokens.css v1.0 (Reise-Cockpit, Indigo & Minze), hier als Kurznamen.
   Vorfreude-Ring + Feier „Es geht los!“: Geometrie und Zeitleiste wie
   src/features/poll/components/countdown-ring.tsx + src/features/poll/celebration.ts.
   ========================================================================== */
:root{
  --bg:#F4F2FB; --surface:#FFFFFF; --raised:#FFFFFF; --sunken:#ECE9F7; --line:#E3DFF0;
  --text:#1E1A3D; --muted:#57527A; --subtle:#6E6992; --border:#8A86A8;
  --primary:#2B2266; --primary-h:#3A2F86; --on-primary:#FFFFFF; --link:#5A3FD0;
  --accent:#52E5B8; --accent-text:#00775A; --accent-tint:#D9F8EC;
  --info-text:#5A3FD0; --info-tint:#ECE6FF;
  --todo-bg:#FFE4DF; --todo-fg:#A3321F; --todo-bar:#F0503F;
  --focus:#2B59C3;
  --ck:#2B2266; --ck-muted:#CFC9F2; --ck-ctrl:rgb(255 255 255 / .12);
  --ck-glow-mint:rgb(82 229 184 / .22); --ck-glow-lav:rgb(167 154 242 / .30);
  --e-sky2:#3F2F99; --e-sky3:#5B48C9;
  --t-lav-bg:#ECE6FF; --t-lav-fg:#5A3FD0; --t-mint-bg:#D9F8EC; --t-mint-fg:#00775A;
  --t-sun-bg:#FFF3CC; --t-sun-fg:#7A5200; --t-coral-bg:#FFE4DF; --t-coral-fg:#A3321F;
  --progress-track:#ECE9F7; --progress-fill:#2B2266;
  --inverse-bg:#1E1A3D; --inverse-text:#FFFFFF;
  --shadow-1:0 1px 2px rgb(30 26 61 / .06), 0 14px 30px -18px rgb(43 34 102 / .38);
  --shadow-2:0 2px 4px rgb(30 26 61 / .06), 0 18px 36px -16px rgb(43 34 102 / .45);
  --shadow-3:0 8px 16px rgb(30 26 61 / .10), 0 24px 40px -20px rgb(43 34 102 / .60);
  --shadow-btn:0 10px 22px -10px rgb(43 34 102 / .60);
  --shadow-btn-acc:0 12px 26px -12px rgb(82 229 184 / .75);
  --av1:#FFD3C7; --av2:#C9DBFF; --av3:#D4F2B0; --av4:#DCD3FF; --av5:#FFE7A3; --av6:#BDEFE0;
  --cf1:#52E5B8; --cf2:#FFCF4A; --cf3:#A79AF2; --cf4:#F0503F; --cf5:#FFFFFF;
  --ring-knob:#FFCF4A; --ring-knob-edge:var(--ck);
  --font-sans:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display:"Plus Jakarta Sans", var(--font-sans);
  --d-instant:80ms; --d-fast:140ms; --d-base:220ms; --d-slow:320ms; --d-moderate:480ms;
  --ease-standard:cubic-bezier(.2,0,0,1); --ease-enter:cubic-bezier(0,0,0,1);
  --dist:16px; --dist-lg:24px; --scale-press:.97;
  --stage-bg:#DCD8EE; --bar-bg:rgb(255 255 255 / .92);
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#14112E; --surface:#1F1A45; --raised:#2A2458; --sunken:#191538; --line:#2F2963;
  --text:#F3F1FF; --muted:#B9B4DC; --subtle:#9C97C4; --border:#7D77AD;
  --primary:#52E5B8; --primary-h:#7DEDCB; --on-primary:#14112E; --link:#52E5B8;
  --accent-text:#52E5B8; --accent-tint:#133C3B;
  --info-text:#C3B8FF; --info-tint:#2E2566;
  --todo-bg:#4A1F1A; --todo-fg:#FFB4A8; --todo-bar:#FF8A7A;
  --focus:#8FB3FF;
  --ck:#221B52; --ck-glow-mint:rgb(82 229 184 / .18); --ck-glow-lav:rgb(167 154 242 / .22);
  --e-sky2:#2E2566; --e-sky3:#3A3370;
  --t-lav-bg:#2E2566; --t-lav-fg:#C3B8FF; --t-mint-bg:#133C3B; --t-mint-fg:#52E5B8;
  --t-sun-bg:#3A3113; --t-sun-fg:#FFDB73; --t-coral-bg:#4A1F1A; --t-coral-fg:#FFB4A8;
  --progress-track:#2E2860; --progress-fill:#52E5B8;
  --inverse-bg:#F3F1FF; --inverse-text:#14112E;
  --shadow-1:0 14px 30px -16px rgb(0 0 0 / .70); --shadow-2:0 18px 36px -14px rgb(0 0 0 / .75);
  --shadow-3:0 24px 48px -16px rgb(0 0 0 / .80);
  --shadow-btn:0 10px 24px -12px rgb(82 229 184 / .55); --shadow-btn-acc:0 10px 24px -12px rgb(82 229 184 / .55);
  --cf4:#FF8A7A;
  --stage-bg:#0B0920; --bar-bg:rgb(31 26 69 / .94);
  color-scheme:dark;
}
[data-motion="reduce"]{ --d-instant:0ms; --d-fast:0ms; --d-base:0ms; --d-slow:0ms; --d-moderate:0ms; --dist:0px; --dist-lg:0px; --scale-press:1; }
@media (prefers-reduced-motion: reduce){ :root{ --d-instant:0ms; --d-fast:0ms; --d-base:0ms; --d-slow:0ms; --d-moderate:0ms; --dist:0px; --dist-lg:0px; --scale-press:1; } }

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; }
body{ font-family:var(--font-sans); background:var(--stage-bg); color:var(--text); min-height:100dvh; -webkit-font-smoothing:antialiased; }
button,input,select{ font:inherit; color:inherit; }
button{ cursor:pointer; }
p{ margin:0; }
.sr-only{ position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.skip{ position:absolute; left:8px; top:-60px; z-index:100; background:#fff; color:#2B2266; padding:10px 14px; border-radius:12px; font-weight:700; }
.skip:focus{ top:8px; }
:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
.on-brand :focus-visible{ outline-color:#FFFFFF; }
svg.ic{ width:22px; height:22px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
svg.ic.s16{ width:16px; height:16px; } svg.ic.s20{ width:20px; height:20px; }

/* ---------------- Steuerleiste ---------------- */
.bar{ position:sticky; top:0; z-index:50; background:var(--bar-bg); backdrop-filter:blur(10px); box-shadow:0 8px 24px -18px rgb(20 17 46 / .6); }
.bar-in{ max-width:1180px; margin:0 auto; padding:12px 20px; display:flex; flex-wrap:wrap; align-items:center; gap:12px 20px; }
.brand{ flex:1 1 260px; min-width:0; }
.brand h1{ margin:0; font:800 19px/1.2 var(--font-display); letter-spacing:-.02em; }
.brand p{ font-size:13px; color:var(--muted); font-weight:600; margin-top:2px; }
.seg{ display:flex; gap:4px; padding:4px; border-radius:14px; background:var(--sunken); }
.seg button{ min-width:48px; min-height:44px; padding:0 12px; border:0; border-radius:11px; background:transparent; font:800 15px/1 var(--font-display); color:var(--muted); }
.seg button[aria-pressed="true"]{ background:var(--surface); color:var(--text); box-shadow:0 0 0 2px var(--text), var(--shadow-1); }
.seg button .vn{ display:block; font:600 12px/1 var(--font-sans); margin-top:3px; }
.ctrls{ display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; }
.play{ display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 16px; border-radius:14px; border:0; background:#52E5B8; color:#2B2266; font-weight:800; box-shadow:var(--shadow-btn-acc); }
.play:active{ transform:scale(var(--scale-press)); }
.sw{ display:inline-flex; align-items:center; gap:8px; min-height:44px; font-size:14px; font-weight:700; cursor:pointer; }
.sw input{ width:20px; height:20px; accent-color:var(--primary); }
.cmp{ display:none; }
@media (min-width: 1000px){ .cmp{ display:inline-flex; } }

/* ---------------- Bühne ---------------- */
.stage{ display:flex; gap:40px; justify-content:center; align-items:flex-start; padding:24px 20px 48px; flex-wrap:wrap; }
.col{ width:390px; display:flex; flex-direction:column; gap:14px; }
.col[hidden]{ display:none; }
.about{ background:var(--surface); border-radius:20px; padding:14px 16px; box-shadow:var(--shadow-1); font-size:14px; line-height:1.45; }
.about h2{ margin:0 0 6px; font:800 17px/1.2 var(--font-display); }
.about p + p{ margin-top:4px; }
.about b{ font-weight:800; }
.cmp-sel{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:14px; }
.cmp-sel select{ min-height:44px; border-radius:12px; border:1.5px solid var(--border); background:var(--surface); padding:0 10px; }
.device{ position:relative; width:390px; height:844px; flex:none; border-radius:52px; background:var(--bg); color:var(--text);
  box-shadow:0 0 0 11px #120F2A, 0 0 0 13px #3A3460, 0 40px 80px -30px rgb(20 17 46 / .7); overflow:hidden; isolation:isolate; }
.sbar{ height:44px; padding:14px 30px 0; display:flex; justify-content:space-between; font:700 14px/1 var(--font-sans); background:var(--bg); color:var(--text); }
.sbar .notch{ width:110px; height:28px; border-radius:20px; background:#000; margin-top:-6px; }
.device[data-v="c"] .sbar, .device[data-v="e"] .sbar{ background:var(--ck); color:#fff; }
.view{ position:absolute; inset:44px 0 0 0; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; background:var(--bg); scrollbar-width:thin; }
.toast{ position:absolute; left:16px; right:16px; bottom:22px; z-index:30; background:var(--inverse-bg); color:var(--inverse-text); padding:12px 14px; border-radius:16px; font-size:14px; font-weight:600; box-shadow:var(--shadow-3);
  opacity:0; transform:translateY(8px); transition:opacity var(--d-base), transform var(--d-base); pointer-events:none; }
.toast.show{ opacity:1; transform:none; }
@media (max-width: 760px){
  .stage{ padding:12px 0 32px; }
  .col{ width:100%; }
  .about{ margin:0 12px; }
  .device{ width:100%; height:calc(100dvh - 24px); min-height:620px; border-radius:0; box-shadow:none; }
  .sbar{ display:none; }
  .view{ inset:0; }
}

/* ---------------- Gemeinsame Bausteine im Handy ---------------- */
.screen{ min-height:100%; padding-bottom:28px; }
.screen.in-f{ animation:inF var(--d-base) var(--ease-standard) backwards; }
.screen.in-b{ animation:inB var(--d-base) var(--ease-standard) backwards; }
@keyframes inF{ from{ opacity:0; transform:translateX(var(--dist-lg)); } }
@keyframes inB{ from{ opacity:0; transform:translateX(calc(-1 * var(--dist-lg))); } }
@keyframes fadeIn{ from{ opacity:0; } }
[data-motion="reduce"] .screen.in-f, [data-motion="reduce"] .screen.in-b{ animation:fadeIn 140ms linear backwards; }
@media (prefers-reduced-motion: reduce){ .screen.in-f, .screen.in-b{ animation:fadeIn 140ms linear backwards; } }
.rise{ animation:rise var(--d-slow) var(--ease-enter) backwards; }
@keyframes rise{ from{ opacity:0; transform:translateY(var(--dist)); } }

.content{ padding:16px 16px 8px; display:flex; flex-direction:column; gap:14px; }
.sec{ font:800 19px/1.2 var(--font-display); letter-spacing:-.02em; margin:6px 2px 0; }
.sec-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.meta{ font-size:13px; font-weight:700; color:var(--muted); }
.small{ font-size:14px; } .muted{ color:var(--muted); }
.card{ background:var(--surface); border-radius:24px; box-shadow:var(--shadow-1); border:1px solid transparent; }
.card.pad{ padding:16px; display:flex; flex-direction:column; gap:12px; }
.card.list{ padding:4px 12px; }
.topbar{ display:flex; align-items:center; gap:8px; padding:6px 12px; }
.tb-label{ flex:1; font-weight:700; font-size:15px; color:var(--muted); }
.on-brand .tb-label{ color:var(--ck-muted); }
.icbtn{ width:44px; height:44px; border-radius:50%; display:inline-grid; place-items:center; border:0; background:var(--sunken); color:var(--text); text-decoration:none; flex:none; }
.on-brand .icbtn{ background:var(--ck-ctrl); color:#fff; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:0 18px; border-radius:16px; font-weight:700; font-size:16px; text-decoration:none; border:2px solid transparent; transition:transform var(--d-instant) var(--ease-standard); }
.btn:active{ transform:scale(var(--scale-press)); }
.btn.primary{ background:var(--primary); color:var(--on-primary); box-shadow:var(--shadow-btn); }
.btn.on-ck{ background:transparent; border-color:rgb(255 255 255 / .6); color:#fff; }
.btn.sm{ min-height:44px; font-size:15px; padding:0 14px; border-radius:12px; }
.btn.block{ width:100%; }
.chip{ display:inline-flex; align-items:center; gap:4px; min-height:26px; padding:2px 10px; border-radius:999px; font-size:13px; font-weight:700; white-space:nowrap; }
.chip.todo{ background:var(--todo-bg); color:var(--todo-fg); }
.chip.sun{ background:#FFCF4A; color:#1E1A3D; }
.chip.new{ background:var(--info-tint); color:var(--info-text); }
.chip.ok{ background:var(--accent-tint); color:var(--accent-text); }
.chip.ghost{ background:var(--sunken); color:var(--muted); }
.cdot{ width:8px; height:8px; border-radius:50%; background:currentColor; }
.tile-ic{ width:40px; height:40px; border-radius:13px; display:grid; place-items:center; flex:none; }
.tile-ic.sm{ width:34px; height:34px; border-radius:11px; }
.t-lav{ background:var(--t-lav-bg); color:var(--t-lav-fg); } .t-mint{ background:var(--t-mint-bg); color:var(--t-mint-fg); }
.t-sun{ background:var(--t-sun-bg); color:var(--t-sun-fg); } .t-coral{ background:var(--t-coral-bg); color:var(--t-coral-fg); }
.row{ display:flex; align-items:center; gap:12px; min-height:60px; padding:10px 4px; color:var(--text); text-decoration:none; border:0; background:none; width:100%; text-align:left; border-radius:14px; }
.row + .row{ border-top:1px solid var(--line); }
.row .grow{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
.row .t{ font-weight:700; font-size:16px; line-height:1.25; }
.row .s{ font-size:14px; color:var(--muted); line-height:1.35; }
.row .t-row{ display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; }
.row.static{ min-height:56px; }
a.row:active{ background:var(--sunken); }
.chev{ color:var(--subtle); display:inline-flex; flex:none; }
.todo{ position:relative; padding:16px 16px 6px; overflow:hidden; }
.todo::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--todo-bar); }
.todo-h{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:12px; }
.todo-h h2, .todo-h h3{ margin:0; font:800 19px/1.2 var(--font-display); letter-spacing:-.02em; }
.todo-first{ display:flex; flex-direction:column; gap:12px; padding-bottom:12px; }
.tf-row{ display:flex; gap:12px; align-items:flex-start; }
.tf-row .t{ font-weight:700; font-size:17px; line-height:1.3; margin-bottom:2px; }
.av{ width:32px; height:32px; border-radius:50%; display:inline-grid; place-items:center; flex:none; font:800 12px/1 var(--font-display); color:#1E1A3D; box-shadow:0 0 0 2px var(--av-ring, var(--surface)); }
.av.sm{ width:28px; height:28px; font-size:12px; }
.av.ph{ background:transparent; border:2px dashed var(--border); color:var(--muted); box-shadow:none; }
.on-brand .av{ --av-ring:var(--ck); }
.on-brand .av.ph{ border-color:rgb(255 255 255 / .7); color:#fff; }
.stack{ display:inline-flex; flex:none; } .stack .av + .av{ margin-left:-8px; }
.dot{ width:9px; height:9px; border-radius:50%; display:inline-block; background:#FFCF4A; flex:none; }
.bar-p{ display:block; height:6px; border-radius:999px; background:var(--progress-track); overflow:hidden; }
.bar-p i{ display:block; height:100%; background:var(--progress-fill); border-radius:inherit; }

/* ---------------- Vorfreude-Ring (countdown-ring.svg v1.0) ---------------- */
.ring{ position:relative; container-type:inline-size; margin-inline:auto; cursor:pointer; -webkit-tap-highlight-color:transparent; }
.ring.wide{ width:100%; aspect-ratio:390 / 192; }
.ring.sq{ aspect-ratio:1 / 1; }
.ring svg{ display:block; width:100%; height:100%; overflow:visible; }
.ring-label{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--ck-muted); font:700 13px/1.2 var(--font-sans); text-align:center; pointer-events:none; }
.ring-label b{ display:block; margin:2px 0; color:#fff; font-family:var(--font-display); font-weight:800; letter-spacing:-.02em; line-height:1; font-variant-numeric:tabular-nums; font-size:46px; }
.ring.wide .ring-label b{ font-size:clamp(28px, 11.4cqw, 54px); }
.ring.sq .ring-label b{ font-size:clamp(28px, 23cqw, 64px); }
.ring.xl .ring-label{ font-size:15px; }
.ring [data-burst]{ position:absolute; inset:0; pointer-events:none; z-index:3; }
.ring [data-burst] i{ position:absolute; top:0; left:0; display:block; }

/* ---------------- Unterseiten (Platzhalter) ---------------- */
.sub-head{ background:radial-gradient(90% 80% at 100% 0, var(--ck-glow-mint), transparent 60%), var(--ck); color:#fff; padding:6px 12px 22px; border-radius:0 0 28px 28px; }
.sub-head .topbar{ padding:0; }
.sub-head .eyebrow{ margin:10px 6px 0; color:var(--ck-muted); font-size:13px; font-weight:700; }
.sub-head h1{ margin:2px 6px 0; font:800 28px/1.15 var(--font-display); letter-spacing:-.02em; }
.sub-head h1:focus{ outline:none; }
.sp-lead{ display:flex; gap:12px; align-items:flex-start; font-size:15px; line-height:1.45; }
.ph-note{ border:2px dashed var(--border); border-radius:16px; padding:12px 14px; color:var(--muted); font-size:14px; line-height:1.45; }
.dec-date{ font:800 22px/1.2 var(--font-display); letter-spacing:-.02em; }
.ok-t{ color:var(--accent-text); display:flex; gap:6px; align-items:center; }
.vote-r{ display:flex; gap:10px; align-items:center; font-size:15px; font-weight:600; flex-wrap:wrap; }
.cal-m{ font:800 16px/1.2 var(--font-display); }
.mcal{ display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; text-align:center; }
.mcal span{ height:38px; display:grid; place-items:center; border-radius:11px; font:700 14px/1 var(--font-display); background:var(--sunken); color:var(--text); }
.mcal .hd{ background:none; height:22px; font:700 12px/1 var(--font-sans); color:var(--muted); }
.mcal .e{ background:none; }
.mcal .sel{ background:var(--primary); color:var(--on-primary); }

/* ======================= A · Bordkarte ======================= */
.ticket{ position:relative; margin:2px 16px 0; border-radius:28px; color:#fff; overflow:hidden; box-shadow:var(--shadow-3);
  background:radial-gradient(110% 60% at 100% 0, var(--ck-glow-mint), transparent 62%), radial-gradient(90% 55% at 0 0, var(--ck-glow-lav), transparent 60%), var(--ck); }
.tk-top{ padding:16px 18px 6px; }
.tk-row{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
.tk-code{ font:700 12px/1 var(--font-display); letter-spacing:.16em; color:var(--ck-muted); }
.tk-name{ margin:12px 0 2px; font:800 34px/1.05 var(--font-display); letter-spacing:-.03em; }
.tk-range{ color:var(--ck-muted); font-weight:600; font-size:15px; }
.ticket .ring{ width:calc(100% + 36px); margin:2px -18px 0; }
.tk-fields{ display:grid; grid-template-columns:repeat(4, 1fr); gap:4px; margin:4px 0 0; }
.tk-fields dt{ font:700 12px/1.2 var(--font-sans); letter-spacing:.06em; text-transform:uppercase; color:var(--ck-muted); }
.tk-fields dd{ margin:3px 0 0; font:800 16px/1.2 var(--font-display); }
.tk-perf{ position:relative; height:26px; }
.tk-perf::before{ content:""; position:absolute; left:22px; right:22px; top:12px; border-top:2px dashed rgb(255 255 255 / .3); }
.tk-perf i{ position:absolute; top:0; width:26px; height:26px; border-radius:50%; background:var(--bg); }
.tk-perf .nl{ left:-13px; } .tk-perf .nr{ right:-13px; }
.tk-stub{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:4px 16px 16px; }
.tk-crew{ display:flex; align-items:center; gap:10px; color:#fff; text-decoration:none; font-weight:700; font-size:14px; line-height:1.3; min-height:44px; border-radius:12px; }

/* ======================= B · Bento ======================= */
.b-head{ padding:2px 18px 14px; }
.b-title{ margin:0; font:800 34px/1.05 var(--font-display); letter-spacing:-.03em; }
.b-sub{ margin-top:6px; color:var(--muted); font-weight:700; font-size:14px; display:flex; align-items:center; gap:8px; }
.bento{ display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 9.5em), 1fr)); gap:12px; padding:0 16px 8px; grid-auto-flow:row dense; }
.bt{ position:relative; border-radius:24px; padding:14px; background:var(--surface); box-shadow:var(--shadow-1); color:var(--text); text-decoration:none; display:flex; flex-direction:column; gap:6px; min-height:140px; overflow:hidden; border:1px solid transparent; transition:transform var(--d-instant) var(--ease-standard); }

.bt-ring .ring{ width:158px; flex:none; margin:0; }
.bt-ring .bt-txt{ display:flex; flex-direction:column; gap:6px; align-items:flex-start; min-width:0; }

.bt-todo::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--todo-bar); }
.bt-todo .todo-h{ margin-bottom:8px; }
.pills{ display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
.pill{ flex:1 1 130px; display:flex; align-items:center; gap:8px; min-height:48px; padding:6px 12px 6px 6px; border-radius:16px; background:var(--sunken); color:var(--text); text-decoration:none; font-weight:700; font-size:14px; line-height:1.25; }
.bt-photo{ display:block; margin:-14px -14px 4px; height:96px; }
.bt-photo svg{ display:block; width:100%; height:100%; }
.bt-costs{ background:var(--t-sun-bg); }
.bt-data{ background:#5B48C9; color:#fff; }
.bt-data .bt-s{ color:#ECE6FF; } .bt-data .chev{ color:#fff; }
.bt-data .tile-ic{ background:rgb(255 255 255 / .16); color:#fff; }

.bt-docs{ background:var(--t-mint-bg); }
.wk{ display:flex; gap:3px; margin:4px 0 2px; }
.wk i{ flex:1; height:22px; border-radius:6px; background:var(--primary); }
.wk i.o{ background:var(--sunken); }

/* ======================= C · Reiseverlauf ======================= */
.ck{ position:relative; color:#fff; border-radius:0 0 30px 30px; padding:4px 12px 18px;
  background:radial-gradient(90% 60% at 100% 0, var(--ck-glow-mint), transparent 62%), radial-gradient(80% 60% at 0 0, var(--ck-glow-lav), transparent 60%), var(--ck); }
.ck .topbar{ padding:2px 0; }
.ck-t{ flex:1; min-width:0; text-align:center; }
.ck-t h1{ margin:0; font:800 21px/1.15 var(--font-display); letter-spacing:-.02em; }
.ck-phase{ margin-top:2px; color:var(--ck-muted); font-size:13px; font-weight:700; display:flex; gap:6px; align-items:center; justify-content:center; }
.ck .ring{ width:calc(100% + 24px); margin:2px -12px 0; }
.ck-range{ text-align:center; margin:2px 0 12px; font:800 18px/1.3 var(--font-display); }
.ck-actions{ display:flex; justify-content:center; }
.tl{ list-style:none; margin:4px 0 0; padding:0; }
.st{ position:relative; padding:0 0 16px 46px; }
.st::before{ content:""; position:absolute; left:15px; top:30px; bottom:-6px; width:3px; border-radius:3px; background:var(--accent-text); }
.st.next::before, .st.later::before, .st.now::before{ background:repeating-linear-gradient(180deg, var(--border) 0 6px, transparent 6px 12px); }
.st:last-child::before{ display:none; }
.mk{ position:absolute; left:0; top:0; width:33px; height:33px; border-radius:50%; display:grid; place-items:center; }
.st.done .mk{ background:#52E5B8; color:#2B2266; }
.st.next .mk, .st.later .mk{ background:var(--surface); border:2.5px solid var(--border); }
.st.now .mk{ background:#FFCF4A; box-shadow:0 0 0 3px var(--bg), 0 0 0 6px #2B2266; }
[data-theme="dark"] .st.now .mk{ box-shadow:0 0 0 3px var(--bg), 0 0 0 6px #52E5B8; }
.st.now .mk::after{ content:""; position:absolute; inset:-6px; border-radius:50%; border:3px solid #FFCF4A; animation:pulse 1.6s var(--ease-standard) 3; opacity:0; }
@keyframes pulse{ 0%{ opacity:.9; transform:scale(1); } 100%{ opacity:0; transform:scale(1.8); } }
[data-motion="reduce"] .st.now .mk::after{ animation:none; }
@media (prefers-reduced-motion: reduce){ .st.now .mk::after{ animation:none; } }
.st.goal .mk{ background:var(--ck); color:#FFCF4A; }
.st-when{ font-size:13px; font-weight:700; color:var(--muted); margin:6px 0 8px; min-height:20px; }
.st-lbl{ display:inline-block; text-transform:uppercase; letter-spacing:.06em; font-size:12px; font-weight:800; color:var(--text); }
.st.now .st-lbl{ background:#FFCF4A; color:#1E1A3D; padding:2px 8px; border-radius:999px; }
.st-card{ display:flex; align-items:center; gap:12px; padding:12px 12px 12px 14px; background:var(--surface); border-radius:20px; box-shadow:var(--shadow-1); color:var(--text); text-decoration:none; min-height:64px; border:1px solid transparent; }
.st-card .grow{ flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
.st-card .t{ font-weight:800; font-size:16px; font-family:var(--font-display); }
.st-card .s{ font-size:14px; color:var(--muted); line-height:1.35; }
.st.done .st-card{ background:transparent; box-shadow:none; border:1.5px solid var(--line); }
.st.goal .st-card{ background:radial-gradient(80% 120% at 100% 0, var(--ck-glow-mint), transparent 60%), var(--ck); color:#fff; }
.st.goal .st-card .s{ color:var(--ck-muted); } .st.goal .st-card .chev{ color:#fff; }
.st.goal .st-card .tile-ic{ background:#FFCF4A; color:#1E1A3D; }
.st.goal .st-card:focus-visible{ outline-color:var(--focus); }

/* ======================= D · Wallet ======================= */
.d-head{ padding:2px 18px 12px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
.d-head h1{ margin:0; font:800 32px/1.05 var(--font-display); letter-spacing:-.03em; }
.pass{ margin:0 16px; border-radius:24px; color:#fff; overflow:hidden; box-shadow:var(--shadow-3);

.pass-strip{ display:flex; align-items:center; gap:8px; padding:12px 16px; border-bottom:2px dashed rgb(255 255 255 / .22); font:800 14px/1 var(--font-display); }

.wcard + .wcard{ margin-top:-24px; }
.wc-coral{ --wc-bg:#FF8A7A; --wc-fg:#1E1A3D; --wc-focus:#1E1A3D; --wc-ic:rgb(255 255 255 / .5); }
.wc-lav{ --wc-bg:#A79AF2; --wc-fg:#1E1A3D; --wc-focus:#1E1A3D; --wc-ic:rgb(255 255 255 / .5); }
.wc-sun{ --wc-bg:#FFCF4A; --wc-fg:#1E1A3D; --wc-focus:#1E1A3D; --wc-ic:rgb(255 255 255 / .55); }

.wc-h{ margin:0; font:inherit; }

.wc-t{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.wc-title{ font:800 17px/1.2 var(--font-display); letter-spacing:-.01em; }

.wb-pad{ padding:0 16px 40px; margin-top:-12px; display:flex; flex-direction:column; gap:10px; font-size:15px; line-height:1.45; }

.wc-big{ font:800 30px/1 var(--font-display); letter-spacing:-.03em; }

.wc-list a{ display:flex; align-items:center; gap:10px; min-height:52px; color:inherit; text-decoration:none; font-weight:700; border-radius:10px; }
.wc-list a .grow{ flex:1; }

/* ---------------- Feier „Es geht los!“ (Port von celebration.ts, W11-02) ---------------- */
const DUR = { fast: 140, base: 220, moderate: 480, fade: 140 };
const EASE_STD = "cubic-bezier(.2,0,0,1)";
const SOFT = (window.CSS && CSS.supports && CSS.supports("transition-timing-function", "linear(0, 1)"))
  ? "linear(0, 0.052 5%, 0.174 10%, 0.325 15%, 0.478 20%, 0.619 25%, 0.738 30%, 0.833 35%, 0.906 40%, 0.991 50%, 1.024 60%, 1.028 70%, 1.021 80%, 1.013 90%, 1)"
  : "cubic-bezier(.34,1.3,.64,1)";
function bezier(x1, y1, x2, y2) {
  return (x) => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let lo = 0, hi = 1, t = x;
    for (let i = 0; i < 26; i++) {
      t = (lo + hi) / 2;
      const bx = 3 * x1 * t * (1 - t) * (1 - t) + 3 * x2 * t * t * (1 - t) + t * t * t;
      if (bx < x) lo = t; else hi = t;
    }
    return 3 * y1 * t * (1 - t) * (1 - t) + 3 * y2 * t * t * (1 - t) + t * t * t;
  };
}
const easeStd = bezier(0.2, 0, 0, 1);
function ringKeyframes(percent) {
  const ring = [], knob = [], steps = 28, lag = 0.12, end = percent * 3.6;
  for (let s = 0; s <= steps; s++) {
    const x = s / steps;
    const head = (100 + percent) * easeStd(x);
    const tail = 100 * easeStd(Math.max(0, (x - lag) / (1 - lag)));
    const len = Math.min(100, Math.max(0, head - tail));
    ring.push({ offset: x, strokeDasharray: `${len.toFixed(2)} ${(100 - len).toFixed(2)}`, strokeDashoffset: (-tail).toFixed(2) });
    knob.push({ offset: x, transform: `rotate(${(head * 3.6 - end).toFixed(1)}deg)` });
  }
  return { ring, knob };
}
function anim(el, kf, opt) {
  if (!el || !el.animate) return null;
  try { return el.animate(kf, opt); } catch (e) {
    const o = Object.assign({}, opt); delete o.easing;
    try { return el.animate(kf, o); } catch (e2) { return null; }
  }
}
const live = new Set();
function celebrate(root) {
  const p = TRIP.pct;
  const T = { glow: 60, ring: 80, dur: 700, pieces: 120, land: 780, sparks: 800 };
  const running = [], timers = [];
  let burst = null, done = false;
  const api = { finish: finish };
  const track = (a) => { if (a) running.push(a); };
  function stopBurst() {
    const b = burst; burst = null;
    if (!b) return;
    const end = () => { b.anims.forEach((a) => a.cancel()); b.layer.remove(); };
    const f = anim(b.layer, [{ opacity: 1 }, { opacity: 0 }], { duration: DUR.fast, fill: "forwards" });
    if (f) f.onfinish = end; else end();
  }
  function finish() {
    if (done) return;
    done = true;
    timers.forEach((t) => clearTimeout(t));
    running.forEach((a) => { try { a.finish(); } catch (e) { /* bereits abgebrochen */ } });
    stopBurst();
    live.delete(api);
  }
  if (reduced()) {
    track(anim(root, [{ opacity: 0 }, { opacity: 1 }], { duration: DUR.fade }));
    done = true;
    return api;
  }
  live.add(api);
  const layer = (n) => root.querySelector(`[data-anim="${n}"]`);
  $$("[data-anim='glow'], [data-piece], [data-anim='sparkles'] path", root).forEach((el) => { el.style.transformBox = "fill-box"; el.style.transformOrigin = "center"; });
  const knob = layer("knob");
  /* Unsichtbarer Kreis r 75 im Knopf-Layer → fill-box ist um die Ringmitte zentriert (unabhängig vom viewBox-Ausschnitt). */
  if (knob) { knob.style.transformBox = "fill-box"; knob.style.transformOrigin = "center"; }
  const dot = root.querySelector("[data-knob-dot]");
  if (dot) { dot.style.transformBox = "fill-box"; dot.style.transformOrigin = "center"; }
  track(anim(layer("glow"), [{ opacity: 0, transform: "scale(0.7)" }, { opacity: 1, transform: "none" }], { duration: DUR.moderate, delay: T.glow, easing: SOFT, fill: "backwards" }));
  const fr = ringKeyframes(p);
  track(anim(root.querySelector("[data-ring-fill]"), fr.ring, { duration: T.dur, delay: T.ring, easing: "linear", fill: "backwards" }));
  track(anim(knob, fr.knob, { duration: T.dur, delay: T.ring, easing: "linear", fill: "backwards" }));
  track(anim(dot, [{ transform: "scale(1)" }, { transform: "scale(1.35)" }, { transform: "scale(1)" }], { duration: DUR.base, delay: T.land, easing: SOFT }));
  $$("[data-piece]", root).forEach((piece, i) => {
    const fall = 90 + ((i * 37) % 70);
    const dx = ((i * 29) % 30) - 15;
    const rot = (i % 2 ? 1 : -1) * (120 + ((i * 53) % 120));
    track(anim(piece, [
      { opacity: 0, transform: `translate(${dx}px, ${-fall}px) rotate(${rot}deg)` },
      { opacity: 1, offset: 0.25, transform: `translate(${(dx * 0.4).toFixed(1)}px, ${(-fall * 0.55).toFixed(1)}px) rotate(${(rot * 0.5).toFixed(0)}deg)` },
      { opacity: 1, transform: "none" }
    ], { duration: 1100 + ((i * 71) % 400), delay: T.pieces + i * 40, easing: EASE_STD, fill: "backwards" }));
  });
  $$("[data-anim='sparkles'] path", root).forEach((s, i) => {
    track(anim(s, [{ opacity: 0, transform: "scale(0)" }, { opacity: 1, transform: "none" }], { duration: DUR.base, delay: T.sparks + i * 60, easing: SOFT, fill: "backwards" }));
  });

  timers.push(setTimeout(finish, 2600));

}
/* Konfetti-Puff aus dem Sonnenpunkt: ≤ 24 Teile mobil, Fächer ± 75°, Schwerkraft, Drehung, Ausblenden ab 70 % */
function puff(root) {
  const svg = root.querySelector("svg");
  if (!svg || !root.isConnected) return null;
  const layer = document.createElement("div");
  layer.setAttribute("aria-hidden", "true");
  layer.setAttribute("data-burst", "");
  root.appendChild(layer);
  const box = svg.getBoundingClientRect();
  const own = root.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const scale = box.width / (vb.width || 390);
  const ang = TRIP.pct * 3.6 * Math.PI / 180;
  const ox = box.left - own.left + (195 + 66 * Math.sin(ang) - vb.x) * scale;
  const oy = box.top - own.top + (236 - 66 * Math.cos(ang) - vb.y) * scale;
  const cs = getComputedStyle(root);
  const colors = [1, 2, 3, 4, 5].map((n) => cs.getPropertyValue("--cf" + n).trim() || "#52E5B8");
  const anims = [];
  for (let i = 0; i < 24; i++) {
    const el = document.createElement("i");
    const shape = i % 4;
    const wh = shape === 0 ? [9, 14] : shape === 1 ? [10, 10] : shape === 2 ? [11, 2.5] : [12, 12];
    el.style.width = wh[0] + "px";
    el.style.height = wh[1] + "px";
    el.style.marginLeft = (-wh[0] / 2) + "px";
    el.style.marginTop = (-wh[1] / 2) + "px";
    el.style.background = colors[i % colors.length];
    if (shape === 0) el.style.borderRadius = "3px";
    if (shape === 1) el.style.borderRadius = "50%";
    if (shape === 2) el.style.borderRadius = "1.25px";
    if (shape === 3) el.style.clipPath = "polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%)";
    layer.appendChild(el);
    const dir = ((-90 + (Math.random() * 150 - 75)) * Math.PI) / 180;
    const speed = 260 + Math.random() * 300;
    const vx = Math.cos(dir) * speed, vy = Math.sin(dir) * speed;
    const duration = 1200 + Math.random() * 500;
    const r0 = Math.random() * 360;
    const spin = (Math.random() < 0.5 ? -1 : 1) * (240 + Math.random() * 360);
    const kf = [];
    for (let s = 0; s <= 10; s++) {
      const f = s / 10, t = (duration * f) / 1000;
      const x = ox + vx * t * (1 - 0.25 * f);
      const y = oy + vy * t + 0.5 * 1100 * t * t;
      kf.push({ transform: `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${(r0 + spin * f).toFixed(0)}deg)`, opacity: f < 0.7 ? 1 : Number(((1 - f) / 0.3).toFixed(2)) });
    }
    const a = anim(el, kf, { duration: duration, delay: Math.random() * 60, easing: "linear", fill: "both" });
    if (a) anims.push(a);
  }
  Promise.all(anims.map((a) => a.finished.catch(() => undefined))).then(() => layer.remove());
  return { layer: layer, anims: anims };
}
function startCel(ring) {
  if (ring._cel) ring._cel.finish();
  ring._cel = celebrate(ring);
}
const finishAll = () => { Array.from(live).forEach((x) => x.finish()); };
["pointerdown", "wheel", "touchmove", "keydown"].forEach((t) => window.addEventListener(t, finishAll, { capture: true, passive: true }));

    con: "Das Ticket kostet Höhe – die To-dos beginnen erst knapp über der Falz; die Bereiche wirken als Liste weniger verspielt." },
  B: { name: "B · Bento", home: homeB,
    idea: "Kacheln unterschiedlicher Größe: Ring als breite Indigo-Kachel, To-dos als breite Karte mit Schnell-Pillen, darunter Bereiche mit großen Kennzahlen (86 €, 5, 15:00) und Bild-Kachel für die Unterkunft.",
    pro: "Alles auf einen Blick, Zahlen springen ins Auge, modern und verspielt; nah am bestehenden W16-Kachelraster.",
    con: "Unruhiger, die Reihenfolge ist weniger eindeutig; Kachelgrößen müssen je Teilphase neu verteilt werden, bei großer Schrift wird alles einspaltig." },
  C: { name: "C · Reiseverlauf", home: homeC,
    idea: "Ring im Indigo-Kopf, darunter ein vertikaler Weg von „Termin steht fest“ über „Heute“ (mit den To-dos) bis „Es geht los!“. Jeder Bereich ist eine Station.",
    pro: "Erzählt den Weg zur Abreise, „Heute“ ist klar verortet, Erledigtes motiviert; Status steht als Wort (Erledigt / Als Nächstes / Später).",
    con: "Wird lang; Bereiche ohne Zeitbezug (Kosten, Infos) passen nur bedingt auf eine Achse – braucht Regeln, was „als Nächstes“ kommt." },
  D: { name: "D · Wallet", home: homeD,
    idea: "Oben ein Reisepass mit Ring, darunter jeder Bereich als farbige Karte im Stapel (wie Apple Wallet). Tippen klappt eine Karte auf – Details und Aktion direkt im Cockpit.",
    pro: "Kompakt: alle Bereiche passen auf etwa einen Bildschirm; kräftige Farben, Status steht auf jeder Kartenkante, Aufklappen ohne Seitenwechsel.",
    con: "Ein Tipp mehr bis zum Inhalt (aufklappen, dann öffnen); eine feste Farbe pro Bereich muss überall gelten; Stapel-Metapher ist nicht allen vertraut." },
  E: { name: "E · Bühne", home: homeE,
    idea: "Eigene Idee: Der Ring geht als Sonne über dem Meer auf – ein ganzer Bildschirm Vorfreude. Darunter To-dos als Wisch-Karten, ein „Reise-Check“ (2 von 5 bereit) und ein schwebendes Dock zu den Bereichen.",
    pro: "Maximale Emotion und Spaß, Ring am größten; jede Aufgabe bekommt eine eigene Taste; das Dock bringt jeden Bereich mit einem Tipp – auch tief unten.",
    con: "Der Kopf kostet einen ganzen Bildschirm, das Karussell versteckt Aufgabe 2–3; das Dock ähnelt Tabs (Konflikt mit UX-1 „keine Tabs“) – UI/UX prüft." }
};
function aboutHTML(v) {
  const V = VAR[v];
  return `<h2>${V.name}</h2><p><b>Idee:</b> ${V.idea}</p><p><b>Stärken:</b> ${V.pro}</p><p><b>Schwächen:</b> ${V.con}</p>`;
}

/* ======================= Steuerung ======================= */
const cols = [0, 1].map((i) => {
  const el = document.querySelector(`[data-col="${i}"]`);
  return { i: i, el: el, device: $(".device", el), view: $(".view", el), about: $(".about", el), toastEl: $(".toast", el),
    variant: "A", page: "home", played: {}, retIdx: -1, scroll: 0, toastT: 0, wOpen: "todo" };
});

function stagger(c) {
  if (reduced()) return;
  $$(".stg", c.view).forEach((el, i) => {
    el.style.animationDelay = Math.min(i * 60, 400) + "ms";
    el.classList.add("rise");
  });
}
function bindHome(c) {
  $$(".carousel", c.view).forEach((car) => {
    const dots = $$(".dots i", c.view);
    const out = $(".car-pos", c.view);
    const upd = () => {
      const items = $$(".ecard", car);
      const mid = car.scrollLeft + car.clientWidth / 2;
      let best = 0, bd = Infinity;
      items.forEach((it, i) => { const d = Math.abs(it.offsetLeft + it.offsetWidth / 2 - mid); if (d < bd) { bd = d; best = i; } });
      dots.forEach((d, i) => d.classList.toggle("on", i === best));
      if (out) out.textContent = (best + 1) + " von " + items.length;
    };
    car.addEventListener("scroll", upd, { passive: true });
  });
}
function render(c, dir) {
  $$("[data-ring]", c.view).forEach((r) => { if (r._cel) r._cel.finish(); });
  const v = c.variant;
  c.device.dataset.v = v.toLowerCase();
  c.device.setAttribute("aria-label", "Handy-Vorschau " + VAR[v].name);
  if (c.aboutV !== v) { c.aboutV = v; c.about.innerHTML = aboutHTML(v); }
  const home = c.page === "home";
  c.view.innerHTML = home ? VAR[v].home(c) : subPage(c.page);
  const scr = $(".screen", c.view);
  if (dir && scr) scr.classList.add(dir === "fwd" ? "in-f" : "in-b");
  if (home) {
    bindHome(c);
    if (dir === "back") {
      c.view.scrollTop = c.scroll;
      const t = $$("[data-go]", c.view)[c.retIdx];
      if (t) t.focus({ preventScroll: true });
    } else {
      c.view.scrollTop = 0;
    }
    if (!c.played[v] && !c.el.hidden) {
      c.played[v] = true;
      stagger(c);
      $$("[data-ring]", c.view).forEach(startCel);
    }
  } else {
    c.view.scrollTop = 0;
    const h = $("h1", c.view);
    if (h && dir) h.focus({ preventScroll: true });
  }
}
function showToast(c, msg) {
  c.toastEl.textContent = msg;
  c.toastEl.classList.add("show");
  clearTimeout(c.toastT);
  c.toastT = setTimeout(() => c.toastEl.classList.remove("show"), 2600);
}
function toggleWallet(c, btn) {
  const key = btn.getAttribute("data-wallet");
  const wasOpen = btn.getAttribute("aria-expanded") === "true";
  c.wOpen = wasOpen ? "" : key;
  $$(".wcard", c.view).forEach((card) => {
    const b = $("[data-wallet]", card);
    const o = b.getAttribute("data-wallet") === c.wOpen;
    card.classList.toggle("open", o);
    b.setAttribute("aria-expanded", String(o));
    const body = $(".wbody", card);
    if (o) body.removeAttribute("inert"); else body.setAttribute("inert", "");
  });
}
cols.forEach((c) => {
  c.view.addEventListener("click", (e) => {
    const t = e.target;
    if (!(t instanceof Element)) return;
    const go = t.closest("[data-go]");
    if (go) {
      e.preventDefault();
      c.retIdx = $$("[data-go]", c.view).indexOf(go);
      c.scroll = c.view.scrollTop;
      c.page = go.getAttribute("data-go");
      render(c, "fwd");
      return;
    }
    if (t.closest("[data-back]")) { e.preventDefault(); c.page = "home"; render(c, "back"); return; }
    const w = t.closest("[data-wallet]");
    if (w) { toggleWallet(c, w); return; }
    const to = t.closest("[data-toast]");
    if (to) { e.preventDefault(); showToast(c, to.getAttribute("data-toast")); return; }
    const r = t.closest("[data-ring]");
    if (r) startCel(r);
  });
});

const seg = $("#varSeg");
const cmpChk = $("#cmpChk");
const cmpSel = $("#cmpSel");
function setVariant(v) {
  const c = cols[0];
  c.variant = v; c.page = "home"; c.retIdx = -1;
  $$("button", seg).forEach((b) => b.setAttribute("aria-pressed", String(b.getAttribute("data-v") === v)));
  try { history.replaceState(null, "", "#" + v); } catch (e) { /* file:// ohne History */ }
  render(c, null);
}
$$("button", seg).forEach((b) => b.addEventListener("click", () => setVariant(b.getAttribute("data-v"))));
cmpChk.addEventListener("change", () => {
  const c = cols[1];
  c.el.hidden = !cmpChk.checked;
  if (cmpChk.checked) { c.page = "home"; render(c, null); }
});
cmpSel.addEventListener("change", () => {
  const c = cols[1];
  c.variant = cmpSel.value; c.page = "home";
  render(c, null);
});
$("#playBtn").addEventListener("click", () => {
  cols.filter((c) => !c.el.hidden).forEach((c) => {
    if (c.page !== "home") { c.page = "home"; render(c, null); }
    c.view.scrollTop = 0;
    $$("[data-ring]", c.view).forEach(startCel);
  });
});
const darkChk = $("#darkChk");
darkChk.checked = window.matchMedia("(prefers-color-scheme: dark)").matches;
html.dataset.theme = darkChk.checked ? "dark" : "light";
darkChk.addEventListener("change", () => { html.dataset.theme = darkChk.checked ? "dark" : "light"; });
const motionChk = $("#motionChk");
motionChk.checked = mqReduce.matches;
if (motionChk.checked) html.dataset.motion = "reduce";
motionChk.addEventListener("change", () => {
  if (motionChk.checked) { html.dataset.motion = "reduce"; finishAll(); } else { delete html.dataset.motion; }
});

const start = (location.hash || "").replace("#", "").toUpperCase();
const first = VAR[start] ? start : "A";
cols[1].variant = first === "B" ? "C" : "B";
cmpSel.value = cols[1].variant;
setVariant(first);
})();
</script>
</body>
</html>
