<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="hmk-t hmk-d">
  <title id="hmk-t">Kalender-Markierungen: Wochenende, Feiertag, Heute, Ausgewählt, Fokus, Vorschlag</title>
  <desc id="hmk-d">Jede Markierung ist über Form oder Position kodiert, nicht nur über Farbe: Wochenende als Spur hinter den Sa/So-Spalten mit Spaltenkopf, Feiertag als Eselsohr-Ecke, Heute als Ring um die Datumszahl, Ausgewählt als Doppelrahmen innen, Fokus als Ring mit Abstand außen, Vorschlag als Band mit Endkappen unter dem Zeitraum. Die Tage mit 9/9 tragen das Häkchen-Badge unten rechts (alle Abgegebenen haben „Geht“). Oben Light, unten Dark. Zur Vereinfachung ist der Fokus hier nur als Ring dargestellt; in der App liegt zusätzlich ein Hof in Hintergrundfarbe auf beiden Seiten des Rings.</desc>
  <defs>
    <clipPath id="mk-cell"><rect width="48" height="56" rx="8"/></clipPath>
  </defs>
  <style>
    .t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; }
    .h { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; }
    .d { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 500; }
    .n { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .l { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; }
    .s { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; }
  </style>

  <!-- ===================== LIGHT ===================== -->
  <rect width="640" height="160" fill="#FBF8F3"/>
  <text x="14" y="18" class="t" fill="#1C2526">Light</text>

  <!-- Wochenende -->
  <rect x="14" y="26" width="116" height="84" rx="10" fill="#ECE5D9"/>
  <g class="h" fill="#1C2526" text-anchor="middle"><text x="44" y="42">Sa</text><text x="100" y="42">So</text></g>
  <g transform="translate(20 50)">
    <rect width="48" height="56" rx="8" fill="#5FBFB1"/>
    <g fill="#1C2526"><text x="5" y="13" class="d">6</text><text x="24" y="37" class="n" text-anchor="middle">5/9</text></g>
  </g>
  <g transform="translate(76 50)">
    <rect width="48" height="56" rx="8" fill="#187E73"/>
    <g fill="#FFFFFF"><text x="5" y="13" class="d">7</text><text x="24" y="37" class="n" text-anchor="middle">7/9</text></g>
  </g>

  <!-- Feiertag -->
  <g transform="translate(160 50)">
    <rect width="48" height="56" rx="8" fill="#A6DBD2"/>
    <polygon points="30,0 48,0 48,18" fill="#D4552F" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round" clip-path="url(#mk-cell)"/>
    <g fill="#1C2526"><text x="5" y="13" class="d">3</text><text x="24" y="37" class="n" text-anchor="middle">4/9</text></g>
  </g>

  <!-- Heute -->
  <g transform="translate(240 50)">
    <rect width="48" height="56" rx="8" fill="#5FBFB1"/>
    <g fill="#1C2526">
      <circle cx="12" cy="12" r="8.5" fill="none" stroke="#1C2526" stroke-width="1.5"/>
      <text x="12" y="15.5" class="d" text-anchor="middle">8</text>
      <text x="24" y="37" class="n" text-anchor="middle">6/9</text>
    </g>
  </g>

  <!-- Ausgewählt -->
  <g transform="translate(320 50)">
    <rect width="48" height="56" rx="8" fill="#187E73"/>
    <rect x="1" y="1" width="46" height="54" rx="7" fill="none" stroke="#1C2526" stroke-width="2"/>
    <rect x="3" y="3" width="42" height="50" rx="5" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <g fill="#FFFFFF"><text x="7" y="15" class="d">9</text><text x="24" y="37" class="n" text-anchor="middle">7/9</text></g>
  </g>

  <!-- Fokus -->
  <g transform="translate(402 50)">
    <rect x="-3.5" y="-3.5" width="55" height="63" rx="11.5" fill="none" stroke="#2B59C3" stroke-width="3"/>
    <rect width="48" height="56" rx="8" fill="#A6DBD2"/>
    <g fill="#1C2526"><text x="5" y="13" class="d">10</text><text x="24" y="37" class="n" text-anchor="middle">3/9</text></g>
  </g>

  <!-- Vorschlag -->
  <g transform="translate(480 50)">
    <rect width="48" height="56" rx="8" fill="#0B4F4A"/>
    <g fill="#FFFFFF"><text x="5" y="13" class="d">11</text><text x="24" y="33" class="n" text-anchor="middle">9/9</text><circle cx="40" cy="46" r="6"/></g>
    <path d="M37 46.2l2 2 3.4-3.8" fill="none" stroke="#0B4F4A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(532 50)">
    <rect width="48" height="56" rx="8" fill="#0B4F4A"/>
    <g fill="#FFFFFF"><text x="5" y="13" class="d">12</text><text x="24" y="33" class="n" text-anchor="middle">9/9</text><circle cx="40" cy="46" r="6"/></g>
    <path d="M37 46.2l2 2 3.4-3.8" fill="none" stroke="#0B4F4A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(584 50)">
    <rect width="48" height="56" rx="8" fill="#187E73"/>
    <g fill="#FFFFFF"><text x="5" y="13" class="d">13</text><text x="24" y="37" class="n" text-anchor="middle">8/9</text></g>
  </g>
  <rect x="480" y="112" width="152" height="4" rx="2" fill="#D4552F"/>
  <rect x="480" y="108" width="3" height="12" rx="1.5" fill="#D4552F"/>
  <rect x="629" y="108" width="3" height="12" rx="1.5" fill="#D4552F"/>

  <g class="l" fill="#1C2526" text-anchor="middle">
    <text x="72" y="136">Wochenende</text>
    <text x="184" y="136">Feiertag</text>
    <text x="264" y="136">Heute</text>
    <text x="344" y="136">Ausgewählt</text>
    <text x="426" y="136">Fokus</text>
    <text x="556" y="136">Vorschlag</text>
  </g>
  <g class="s" fill="#55605F" text-anchor="middle">
    <text x="72" y="151">Spur hinter Sa/So</text>
    <text x="184" y="151">Eselsohr-Ecke</text>
    <text x="264" y="151">Ring um Datum</text>
    <text x="344" y="151">Doppelrahmen</text>
    <text x="426" y="151">Ring mit Abstand</text>
    <text x="556" y="151">Band mit Endkappen</text>
  </g>

  <!-- ===================== DARK ===================== -->
  <rect y="160" width="640" height="160" fill="#111819"/>
  <text x="14" y="178" class="t" fill="#ECF1F0">Dark</text>

  <rect x="14" y="186" width="116" height="84" rx="10" fill="#1B2526"/>
  <g class="h" fill="#ECF1F0" text-anchor="middle"><text x="44" y="202">Sa</text><text x="100" y="202">So</text></g>
  <g transform="translate(20 210)">
    <rect width="48" height="56" rx="8" fill="#287268"/>
    <g fill="#ECF1F0"><text x="5" y="13" class="d">6</text><text x="24" y="37" class="n" text-anchor="middle">5/9</text></g>
  </g>
  <g transform="translate(76 210)">
    <rect width="48" height="56" rx="8" fill="#6CCFC0"/>
    <g fill="#0B1F1E"><text x="5" y="13" class="d">7</text><text x="24" y="37" class="n" text-anchor="middle">7/9</text></g>
  </g>

  <g transform="translate(160 210)">
    <rect width="48" height="56" rx="8" fill="#1D4B46"/>
    <polygon points="30,0 48,0 48,18" fill="#F28A6E" stroke="#111819" stroke-width="1.5" stroke-linejoin="round" clip-path="url(#mk-cell)"/>
    <g fill="#ECF1F0"><text x="5" y="13" class="d">3</text><text x="24" y="37" class="n" text-anchor="middle">4/9</text></g>
  </g>

  <g transform="translate(240 210)">
    <rect width="48" height="56" rx="8" fill="#287268"/>
    <g fill="#ECF1F0">
      <circle cx="12" cy="12" r="8.5" fill="none" stroke="#ECF1F0" stroke-width="1.5"/>
      <text x="12" y="15.5" class="d" text-anchor="middle">8</text>
      <text x="24" y="37" class="n" text-anchor="middle">6/9</text>
    </g>
  </g>

  <g transform="translate(320 210)">
    <rect width="48" height="56" rx="8" fill="#6CCFC0"/>
    <rect x="1" y="1" width="46" height="54" rx="7" fill="none" stroke="#ECF1F0" stroke-width="2"/>
    <rect x="3" y="3" width="42" height="50" rx="5" fill="none" stroke="#111819" stroke-width="2"/>
    <g fill="#0B1F1E"><text x="7" y="15" class="d">9</text><text x="24" y="37" class="n" text-anchor="middle">7/9</text></g>
  </g>

  <g transform="translate(402 210)">
    <rect x="-3.5" y="-3.5" width="55" height="63" rx="11.5" fill="none" stroke="#8FB3FF" stroke-width="3"/>
    <rect width="48" height="56" rx="8" fill="#1D4B46"/>
    <g fill="#ECF1F0"><text x="5" y="13" class="d">10</text><text x="24" y="37" class="n" text-anchor="middle">3/9</text></g>
  </g>

  <g transform="translate(480 210)">
    <rect width="48" height="56" rx="8" fill="#B5F0E4"/>
    <g fill="#0B1F1E"><text x="5" y="13" class="d">11</text><text x="24" y="33" class="n" text-anchor="middle">9/9</text><circle cx="40" cy="46" r="6"/></g>
    <path d="M37 46.2l2 2 3.4-3.8" fill="none" stroke="#B5F0E4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(532 210)">
    <rect width="48" height="56" rx="8" fill="#B5F0E4"/>
    <g fill="#0B1F1E"><text x="5" y="13" class="d">12</text><text x="24" y="33" class="n" text-anchor="middle">9/9</text><circle cx="40" cy="46" r="6"/></g>
    <path d="M37 46.2l2 2 3.4-3.8" fill="none" stroke="#B5F0E4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(584 210)">
    <rect width="48" height="56" rx="8" fill="#6CCFC0"/>
    <g fill="#0B1F1E"><text x="5" y="13" class="d">13</text><text x="24" y="37" class="n" text-anchor="middle">8/9</text></g>
  </g>
  <rect x="480" y="272" width="152" height="4" rx="2" fill="#F28A6E"/>
  <rect x="480" y="268" width="3" height="12" rx="1.5" fill="#F28A6E"/>
  <rect x="629" y="268" width="3" height="12" rx="1.5" fill="#F28A6E"/>

  <g class="l" fill="#ECF1F0" text-anchor="middle">
    <text x="72" y="296">Wochenende</text>
    <text x="184" y="296">Feiertag</text>
    <text x="264" y="296">Heute</text>
    <text x="344" y="296">Ausgewählt</text>
    <text x="426" y="296">Fokus</text>
    <text x="556" y="296">Vorschlag</text>
  </g>
  <g class="s" fill="#A9B4B2" text-anchor="middle">
    <text x="72" y="311">Spur hinter Sa/So</text>
    <text x="184" y="311">Eselsohr-Ecke</text>
    <text x="264" y="311">Ring um Datum</text>
    <text x="344" y="311">Doppelrahmen</text>
    <text x="426" y="311">Ring mit Abstand</text>
    <text x="556" y="311">Band mit Endkappen</text>
  </g>
</svg>
