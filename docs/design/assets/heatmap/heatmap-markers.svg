<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 172" width="744" height="344" role="img" aria-labelledby="t d">
  <title id="t">Kalender-Markierungen hell und dunkel (v1.0)</title>
  <desc id="d">Je Zeile: Feiertag als Eselsohr mit Kerbe in Kartenfarbe, Heute als Ring um die Datumszahl, Ausgewählt als Doppelrahmen innen, Fokus als Ring außen mit Hof, Vorschlag als 4-Pixel-Band in der Zeilenfuge mit Endkappen über drei Tage, Wochenend-Spur hinter Samstag und Sonntag.</desc>
  <!-- HELL -->
  <rect x="0" y="0" width="372" height="86" rx="16" fill="#FFFFFF"/>
  <rect x="294" y="8" width="70" height="70" rx="10" fill="#A79AF2" fill-opacity=".16"/>
  <g font-family="Figtree, sans-serif" font-weight="600" font-size="11">
    <!-- Feiertag -->
    <rect x="10" y="16" width="44" height="46" rx="11" fill="#A79AF2"/>
    <path d="M36 16H43A11 11 0 0 1 54 27V34Z" fill="#FFFFFF"/>
    <path d="M41 16H43A11 11 0 0 1 54 27V29Z" fill="#F0503F"/>
    <text x="16" y="29" fill="#1E1A3D">1</text>
    <!-- Heute -->
    <rect x="62" y="16" width="44" height="46" rx="11" fill="#D6CFFA"/>
    <circle cx="71.5" cy="25.5" r="8" fill="none" stroke="#1E1A3D" stroke-width="1.5"/>
    <text x="71.5" y="29.5" text-anchor="middle" fill="#1E1A3D">12</text>
    <!-- Ausgewählt -->
    <rect x="114" y="16" width="44" height="46" rx="11" fill="#5B48C9"/>
    <rect x="115" y="17" width="42" height="44" rx="10" fill="none" stroke="#1E1A3D" stroke-width="2"/>
    <rect x="117" y="19" width="38" height="40" rx="8" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="122" y="31" fill="#FFFFFF">13</text>
    <!-- Fokus -->
    <rect x="166" y="16" width="44" height="46" rx="11" fill="#2B2266"/>
    <rect x="162.5" y="12.5" width="51" height="53" rx="14.5" fill="none" stroke="#2B59C3" stroke-width="3"/>
    <text x="172" y="29" fill="#FFFFFF">14</text>
    <!-- Vorschlag-Band über drei Tage (Endkappen nur an An- und Abreisetag) -->
    <rect x="218" y="16" width="34" height="46" rx="11" fill="#2B2266"/>
    <rect x="256" y="16" width="34" height="46" rx="11" fill="#2B2266"/>
    <rect x="298" y="16" width="30" height="46" rx="11" fill="#2B2266"/>
    <rect x="218" y="66.5" width="110" height="4" fill="#2B2266"/>
    <rect x="218" y="64.5" width="4" height="9" rx="2" fill="#2B2266"/>
    <rect x="324" y="64.5" width="4" height="9" rx="2" fill="#2B2266"/>
    <text x="224" y="29" fill="#FFFFFF">15</text>
    <text x="262" y="29" fill="#FFFFFF">16</text>
    <text x="304" y="29" fill="#FFFFFF" font-weight="700">17</text>
  </g>

  <!-- DUNKEL -->
  <rect x="0" y="86" width="372" height="86" rx="16" fill="#1F1A45"/>
  <rect x="294" y="94" width="70" height="70" rx="10" fill="#A79AF2" fill-opacity=".08"/>
  <g font-family="Figtree, sans-serif" font-weight="600" font-size="11">
    <rect x="10" y="102" width="44" height="46" rx="11" fill="#5B48C9"/>
    <path d="M36 102H43A11 11 0 0 1 54 113V120Z" fill="#1F1A45"/>
    <path d="M41 102H43A11 11 0 0 1 54 113V115Z" fill="#FF8A7A"/>
    <text x="16" y="115" fill="#FFFFFF">1</text>
    <rect x="62" y="102" width="44" height="46" rx="11" fill="#362C7A"/>
    <circle cx="71.5" cy="111.5" r="8" fill="none" stroke="#F3F1FF" stroke-width="1.5"/>
    <text x="71.5" y="115.5" text-anchor="middle" fill="#F3F1FF">12</text>
    <rect x="114" y="102" width="44" height="46" rx="11" fill="#A79AF2"/>
    <rect x="115" y="103" width="42" height="44" rx="10" fill="none" stroke="#F3F1FF" stroke-width="2"/>
    <rect x="117" y="105" width="38" height="40" rx="8" fill="none" stroke="#14112E" stroke-width="2"/>
    <text x="122" y="117" fill="#14112E">13</text>
    <rect x="166" y="102" width="44" height="46" rx="11" fill="#52E5B8"/>
    <rect x="162.5" y="98.5" width="51" height="53" rx="14.5" fill="none" stroke="#8FB3FF" stroke-width="3"/>
    <text x="172" y="115" fill="#14112E">14</text>
    <rect x="218" y="102" width="34" height="46" rx="11" fill="#52E5B8"/>
    <rect x="256" y="102" width="34" height="46" rx="11" fill="#52E5B8"/>
    <rect x="298" y="102" width="30" height="46" rx="11" fill="#52E5B8"/>
    <rect x="218" y="152.5" width="110" height="4" fill="#52E5B8"/>
    <rect x="218" y="150.5" width="4" height="9" rx="2" fill="#52E5B8"/>
    <rect x="324" y="150.5" width="4" height="9" rx="2" fill="#52E5B8"/>
    <text x="224" y="115" fill="#14112E">15</text>
    <text x="262" y="115" fill="#14112E">16</text>
    <text x="304" y="115" fill="#14112E" font-weight="700">17</text>
  </g>
</svg>
