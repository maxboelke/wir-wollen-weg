<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340" role="img" aria-labelledby="t d">
  <title id="t">Heatmap-Skala: sechs Stufen in Light und Dark</title>
  <desc id="d">Beispiel für eine Gruppe mit 9 abgegebenen Mitgliedern. Jede Stufe ist dreifach kodiert: Helligkeit der Fläche, Zahl „können/abgegeben“ und Pegel aus vier Segmenten am unteren Rand. Zusätzlich: „keine Daten“ gestrichelter Rahmen und Strich, „niemand“ Schraffur. Häkchen-Badge: niemand hat „geht nicht“ (kann auch auf helleren Stufen erscheinen, wenn Personen nur „zur Not“ können). Das Halbkreis-Symbol zeigt, dass mindestens eine Person „ginge zur Not“ angegeben hat.</desc>
  <defs>
    <pattern id="lg-hatch-l" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="1.5" height="6" fill="#CFC9C0"/>
    </pattern>
    <pattern id="lg-hatch-d" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="1.5" height="6" fill="#3A4544"/>
    </pattern>
  </defs>
  <style>
    .t  { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; }
    .d  { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; }
    .n  { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .l  { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; }
    .s  { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; }
  </style>

  <!-- ===================== LIGHT ===================== -->
  <rect width="480" height="170" fill="#FBF8F3"/>
  <text x="18" y="22" class="t" fill="#1C2526">Light · 9 Personen haben abgegeben</text>

  <!-- keine Daten -->
  <g transform="translate(18 34)">
    <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="8" fill="none" stroke="#858C8A" stroke-width="1.5" stroke-dasharray="4 3"/>
    <g fill="#667070">
      <text x="6" y="15" class="d">12</text>
      <text x="32" y="40" class="n" text-anchor="middle">–</text>
    </g>
  </g>
  <!-- niemand -->
  <g transform="translate(94 34)">
    <rect width="64" height="64" rx="8" fill="#F1EEE8"/>
    <rect width="64" height="64" rx="8" fill="url(#lg-hatch-l)"/>
    <g fill="#1C2526">
      <text x="6" y="15" class="d">13</text>
      <text x="32" y="40" class="n" text-anchor="middle">0/9</text>
      <g opacity="0.28"><rect x="7" y="53" width="11" height="4" rx="1"/><rect x="20" y="53" width="11" height="4" rx="1"/><rect x="33" y="53" width="11" height="4" rx="1"/><rect x="46" y="53" width="11" height="4" rx="1"/></g>
    </g>
  </g>
  <!-- wenige -->
  <g transform="translate(170 34)">
    <rect width="64" height="64" rx="8" fill="#A6DBD2"/>
    <g fill="#1C2526">
      <text x="6" y="15" class="d">14</text>
      <text x="32" y="40" class="n" text-anchor="middle">3/9</text>
      <rect x="7" y="53" width="11" height="4" rx="1"/>
      <g opacity="0.28"><rect x="20" y="53" width="11" height="4" rx="1"/><rect x="33" y="53" width="11" height="4" rx="1"/><rect x="46" y="53" width="11" height="4" rx="1"/></g>
    </g>
  </g>
  <!-- einige (mit „zur Not“-Hinweis) -->
  <g transform="translate(246 34)">
    <rect width="64" height="64" rx="8" fill="#5FBFB1"/>
    <g fill="#1C2526">
      <text x="6" y="15" class="d">15</text>
      <text x="32" y="40" class="n" text-anchor="middle">5/9</text>
      <rect x="7" y="53" width="11" height="4" rx="1"/><rect x="20" y="53" width="11" height="4" rx="1"/>
      <g opacity="0.28"><rect x="33" y="53" width="11" height="4" rx="1"/><rect x="46" y="53" width="11" height="4" rx="1"/></g>
      <circle cx="54" cy="11" r="4.5" fill="none" stroke="#1C2526" stroke-width="1.5"/>
      <path d="M54 6.5a4.5 4.5 0 0 1 0 9z"/>
    </g>
  </g>
  <!-- viele -->
  <g transform="translate(322 34)">
    <rect width="64" height="64" rx="8" fill="#187E73"/>
    <g fill="#FFFFFF">
      <text x="6" y="15" class="d">16</text>
      <text x="32" y="40" class="n" text-anchor="middle">7/9</text>
      <rect x="7" y="53" width="11" height="4" rx="1"/><rect x="20" y="53" width="11" height="4" rx="1"/><rect x="33" y="53" width="11" height="4" rx="1"/>
      <g opacity="0.35"><rect x="46" y="53" width="11" height="4" rx="1"/></g>
    </g>
  </g>
  <!-- alle -->
  <g transform="translate(398 34)">
    <rect width="64" height="64" rx="8" fill="#0B4F4A"/>
    <g fill="#FFFFFF">
      <text x="6" y="15" class="d">17</text>
      <text x="32" y="40" class="n" text-anchor="middle">9/9</text>
      <rect x="7" y="53" width="11" height="4" rx="1"/><rect x="20" y="53" width="11" height="4" rx="1"/><rect x="33" y="53" width="11" height="4" rx="1"/><rect x="46" y="53" width="11" height="4" rx="1"/>
      <circle cx="53" cy="11" r="7"/>
    </g>
    <path d="M49.5 11.2l2.4 2.4 4-4.4" fill="none" stroke="#0B4F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#1C2526" text-anchor="middle" class="l">
    <text x="50" y="116">keine Daten</text>
    <text x="126" y="116">niemand</text>
    <text x="202" y="116">wenige</text>
    <text x="278" y="116">einige</text>
    <text x="354" y="116">viele</text>
    <text x="430" y="116">alle</text>
  </g>
  <g fill="#55605F" text-anchor="middle" class="s">
    <text x="50" y="132">nicht abgegeben</text>
    <text x="126" y="132">s = 0</text>
    <text x="202" y="132">s &lt; 50 %</text>
    <text x="278" y="132">50–74 %</text>
    <text x="354" y="132">≥ 75 %</text>
    <text x="430" y="132">s = 100 %</text>
  </g>
  <text x="18" y="156" class="s" fill="#55605F">s = (geht + ½ · zur Not) / abgegeben · ◐ = jemand „zur Not“ · ✓ = niemand „geht nicht“</text>

  <!-- ===================== DARK ===================== -->
  <rect y="170" width="480" height="170" fill="#111819"/>
  <text x="18" y="192" class="t" fill="#ECF1F0">Dark · 9 Personen haben abgegeben</text>

  <g transform="translate(18 204)">
    <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="8" fill="none" stroke="#6B7775" stroke-width="1.5" stroke-dasharray="4 3"/>
    <g fill="#8F9A97">
      <text x="6" y="15" class="d">12</text>
      <text x="32" y="40" class="n" text-anchor="middle">–</text>
    </g>
  </g>
  <g transform="translate(94 204)">
    <rect width="64" height="64" rx="8" fill="#1C2526"/>
    <rect width="64" height="64" rx="8" fill="url(#lg-hatch-d)"/>
    <g fill="#ECF1F0">
      <text x="6" y="15" class="d">13</text>
      <text x="32" y="40" class="n" text-anchor="middle">0/9</text>
      <g opacity="0.28"><rect x="7" y="53" width="11" height="4" rx="1"/><rect x="20" y="53" width="11" height="4" rx="1"/><rect x="33" y="53" width="11" height="4" rx="1"/><rect x="46" y="53" width="11" height="4" rx="1"/></g>
    </g>
  </g>
  <g transform="translate(170 204)">
    <rect width="64" height="64" rx="8" fill="#1D4B46"/>
    <g fill="#ECF1F0">
      <text x="6" y="15" class="d">14</text>
      <text x="32" y="40" class="n" text-anchor="middle">3/9</text>
      <rect x="7" y="53" width="11" height="4" rx="1"/>
      <g opacity="0.28"><rect x="20" y="53" width="11" height="4" rx="1"/><rect x="33" y="53" width="11" height="4" rx="1"/><rect x="46" y="53" width="11" height="4" rx="1"/></g>
    </g>
  </g>
  <g transform="translate(246 204)">
    <rect width="64" height="64" rx="8" fill="#287268"/>
    <g fill="#ECF1F0">
      <text x="6" y="15" class="d">15</text>
      <text x="32" y="40" class="n" text-anchor="middle">5/9</text>
      <rect x="7" y="53" width="11" height="4" rx="1"/><rect x="20" y="53" width="11" height="4" rx="1"/>
      <g opacity="0.28"><rect x="33" y="53" width="11" height="4" rx="1"/><rect x="46" y="53" width="11" height="4" rx="1"/></g>
      <circle cx="54" cy="11" r="4.5" fill="none" stroke="#ECF1F0" stroke-width="1.5"/>
      <path d="M54 6.5a4.5 4.5 0 0 1 0 9z"/>
    </g>
  </g>
  <g transform="translate(322 204)">
    <rect width="64" height="64" rx="8" fill="#6CCFC0"/>
    <g fill="#0B1F1E">
      <text x="6" y="15" class="d">16</text>
      <text x="32" y="40" class="n" text-anchor="middle">7/9</text>
      <rect x="7" y="53" width="11" height="4" rx="1"/><rect x="20" y="53" width="11" height="4" rx="1"/><rect x="33" y="53" width="11" height="4" rx="1"/>
      <g opacity="0.28"><rect x="46" y="53" width="11" height="4" rx="1"/></g>
    </g>
  </g>
  <g transform="translate(398 204)">
    <rect width="64" height="64" rx="8" fill="#B5F0E4"/>
    <g fill="#0B1F1E">
      <text x="6" y="15" class="d">17</text>
      <text x="32" y="40" class="n" text-anchor="middle">9/9</text>
      <rect x="7" y="53" width="11" height="4" rx="1"/><rect x="20" y="53" width="11" height="4" rx="1"/><rect x="33" y="53" width="11" height="4" rx="1"/><rect x="46" y="53" width="11" height="4" rx="1"/>
      <circle cx="53" cy="11" r="7"/>
    </g>
    <path d="M49.5 11.2l2.4 2.4 4-4.4" fill="none" stroke="#B5F0E4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#ECF1F0" text-anchor="middle" class="l">
    <text x="50" y="286">keine Daten</text>
    <text x="126" y="286">niemand</text>
    <text x="202" y="286">wenige</text>
    <text x="278" y="286">einige</text>
    <text x="354" y="286">viele</text>
    <text x="430" y="286">alle</text>
  </g>
  <g fill="#A9B4B2" text-anchor="middle" class="s">
    <text x="50" y="302">nicht abgegeben</text>
    <text x="126" y="302">s = 0</text>
    <text x="202" y="302">s &lt; 50 %</text>
    <text x="278" y="302">50–74 %</text>
    <text x="354" y="302">≥ 75 %</text>
    <text x="430" y="302">s = 100 %</text>
  </g>
  <text x="18" y="326" class="s" fill="#A9B4B2">Helligkeit steigt in Dark mit der Zahl der Personen („mehr = mehr Kontrast zum Grund“).</text>
</svg>
