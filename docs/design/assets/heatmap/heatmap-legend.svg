<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 156" width="744" height="312" role="img" aria-labelledby="t d">
  <title id="t">Heatmap-Stufen hell und dunkel (v1.0, Indigo-Rampe)</title>
  <desc id="d">Oben hell auf weißer Karte, unten dunkel auf Mitternacht-Karte. Je sechs Zellen: keine Daten (gestrichelt, Strich), niemand (Schraffur, 0/5), wenige (1/5), einige (3/5), viele (4/5 mit Halbkreis für Zur Not unten links), alle (5/5 mit Siegel unten rechts). Datum oben links.</desc>
  <defs>
    <pattern id="hl-none-l" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#EEECF5"/><rect width="1.5" height="6" fill="#C9C6D4"/>
    </pattern>
    <pattern id="hl-none-d" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#221C4A"/><rect width="1.5" height="6" fill="#3A3370"/>
    </pattern>
  </defs>
  <!-- HELL -->
  <rect x="0" y="0" width="372" height="78" rx="16" fill="#FFFFFF"/>
  <g font-family="Plus Jakarta Sans, Figtree, sans-serif" text-anchor="middle">
    <rect x="9" y="16" width="52" height="46" rx="11" fill="none" stroke="#8A86A8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="35" y="44" font-weight="800" font-size="14" fill="#57527A">–</text>
    <rect x="69" y="16" width="52" height="46" rx="11" fill="url(#hl-none-l)"/>
    <text x="95" y="44" font-weight="800" font-size="14" fill="#1E1A3D">0/5</text>
    <rect x="129" y="16" width="52" height="46" rx="11" fill="#D6CFFA"/>
    <text x="155" y="44" font-weight="800" font-size="14" fill="#1E1A3D">1/5</text>
    <rect x="189" y="16" width="52" height="46" rx="11" fill="#A79AF2"/>
    <text x="215" y="44" font-weight="800" font-size="14" fill="#1E1A3D">3/5</text>
    <rect x="249" y="16" width="52" height="46" rx="11" fill="#5B48C9"/>
    <text x="275" y="44" font-weight="800" font-size="14" fill="#FFFFFF">4/5</text>
    <rect x="309" y="16" width="52" height="46" rx="11" fill="#2B2266"/>
    <text x="335" y="44" font-weight="800" font-size="14" fill="#FFFFFF">5/5</text>
  </g>
  <g font-family="Figtree, sans-serif" font-weight="600" font-size="11">
    <text x="75" y="29" fill="#1E1A3D">3</text><text x="135" y="29" fill="#1E1A3D">4</text><text x="195" y="29" fill="#1E1A3D">5</text><text x="255" y="29" fill="#FFFFFF">6</text><text x="315" y="29" fill="#FFFFFF">7</text>
  </g>
  <!-- Zur Not (Halbkreis unten links) auf „viele“ -->
  <g transform="translate(254 50)"><circle cx="5.5" cy="5.5" r="4.6" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><path d="M5.5 0.9a4.6 4.6 0 0 0 0 9.2z" fill="#FFFFFF"/></g>
  <!-- Siegel „Alle: Geht“ unten rechts auf „alle“ -->
  <g transform="translate(342 45)"><circle cx="8" cy="8" r="7.8" fill="#52E5B8" stroke="#FFFFFF" stroke-width="1.4"/><path d="M4.5 8.3l2.3 2.3 4.6-4.9" fill="none" stroke="#2B2266" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>

  <!-- DUNKEL -->
  <rect x="0" y="78" width="372" height="78" rx="16" fill="#1F1A45"/>
  <g font-family="Plus Jakarta Sans, Figtree, sans-serif" text-anchor="middle">
    <rect x="9" y="94" width="52" height="46" rx="11" fill="none" stroke="#7D77AD" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="35" y="122" font-weight="800" font-size="14" fill="#B9B4DC">–</text>
    <rect x="69" y="94" width="52" height="46" rx="11" fill="url(#hl-none-d)"/>
    <text x="95" y="122" font-weight="800" font-size="14" fill="#F3F1FF">0/5</text>
    <rect x="129" y="94" width="52" height="46" rx="11" fill="#362C7A"/>
    <text x="155" y="122" font-weight="800" font-size="14" fill="#F3F1FF">1/5</text>
    <rect x="189" y="94" width="52" height="46" rx="11" fill="#5B48C9"/>
    <text x="215" y="122" font-weight="800" font-size="14" fill="#FFFFFF">3/5</text>
    <rect x="249" y="94" width="52" height="46" rx="11" fill="#A79AF2"/>
    <text x="275" y="122" font-weight="800" font-size="14" fill="#14112E">4/5</text>
    <rect x="309" y="94" width="52" height="46" rx="11" fill="#52E5B8"/>
    <text x="335" y="122" font-weight="800" font-size="14" fill="#14112E">5/5</text>
  </g>
  <g font-family="Figtree, sans-serif" font-weight="600" font-size="11">
    <text x="75" y="107" fill="#F3F1FF">3</text><text x="135" y="107" fill="#F3F1FF">4</text><text x="195" y="107" fill="#FFFFFF">5</text><text x="255" y="107" fill="#14112E">6</text><text x="315" y="107" fill="#14112E">7</text>
  </g>
  <g transform="translate(254 128)"><circle cx="5.5" cy="5.5" r="4.6" fill="none" stroke="#14112E" stroke-width="1.5"/><path d="M5.5 0.9a4.6 4.6 0 0 0 0 9.2z" fill="#14112E"/></g>
  <g transform="translate(342 123)"><circle cx="8" cy="8" r="7.8" fill="#14112E"/><path d="M4.5 8.3l2.3 2.3 4.6-4.9" fill="none" stroke="#52E5B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
