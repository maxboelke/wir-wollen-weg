  <title id="t">Eigene Verfügbarkeit: Geht, Zur Not, Geht nicht (v1.0)</title>
  <desc id="d">Oben hell, unten dunkel. Geht: glatte Minze-Fläche ohne Symbol. Zur Not: Sonnenstreifen mit Halbkreis auf runder Plakette. Geht nicht: Kreuzschraffur mit Kreuz auf runder Plakette. Rechts jeweils das Pinsel-Mini-Feld. Works, If needed, Can't.</desc>
