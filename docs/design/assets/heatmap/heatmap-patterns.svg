<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 120" width="744" height="240" role="img" aria-labelledby="t d">
  <title id="t">Muster v1.0: Schraffur niemand, Sonnenstreifen Zur Not, Kreuzschraffur Geht nicht</title>
  <desc id="d">Pattern-Definitionen für hell und dunkel. In der App bevorzugt die CSS-Verläufe aus tokens.css (ww-pattern-hm-none, ww-pattern-avail-maybe, ww-pattern-avail-no) verwenden; diese Datei dient für SVG-Grafiken und als Referenz.</desc>
  <defs>
    <!-- niemand: 45 Grad, Linie 1,5 px, Abstand 6 px -->
    <pattern id="ww-pat-hm-none-light" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#EEECF5"/><rect width="1.5" height="6" fill="#C9C6D4"/>
    </pattern>
    <pattern id="ww-pat-hm-none-dark" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#221C4A"/><rect width="1.5" height="6" fill="#3A3370"/>
    </pattern>
    <!-- Zur Not: 135 Grad, Streifen 6 px / 12 px -->
    <pattern id="ww-pat-maybe-light" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="6" height="12" fill="#FFDB73"/><rect x="6" width="6" height="12" fill="#FFF3CC"/>
    </pattern>
    <pattern id="ww-pat-maybe-dark" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="6" height="12" fill="#5A4A17"/><rect x="6" width="6" height="12" fill="#3A3113"/>
    </pattern>
    <!-- Geht nicht: Kreuzschraffur 45 und 135 Grad, Linie 1,5 px, Abstand 7 px -->
    <pattern id="ww-pat-no-light" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#DDD9EA"/><rect width="1.5" height="7" fill="#ABA7BD"/><rect width="7" height="1.5" fill="#ABA7BD"/>
    </pattern>
    <pattern id="ww-pat-no-dark" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#2E2860"/><rect width="1.5" height="7" fill="#4A4290"/><rect width="7" height="1.5" fill="#4A4290"/>
    </pattern>
  </defs>
  <rect width="372" height="60" fill="#FFFFFF"/>
  <rect y="60" width="372" height="60" fill="#1F1A45"/>
  <rect x="12" y="8" width="108" height="44" rx="11" fill="url(#ww-pat-hm-none-light)"/>
  <rect x="132" y="8" width="108" height="44" rx="11" fill="url(#ww-pat-maybe-light)"/>
  <rect x="252" y="8" width="108" height="44" rx="11" fill="url(#ww-pat-no-light)"/>
  <rect x="12" y="68" width="108" height="44" rx="11" fill="url(#ww-pat-hm-none-dark)"/>
  <rect x="132" y="68" width="108" height="44" rx="11" fill="url(#ww-pat-maybe-dark)"/>
  <rect x="252" y="68" width="108" height="44" rx="11" fill="url(#ww-pat-no-dark)"/>
</svg>
