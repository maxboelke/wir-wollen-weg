<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" aria-hidden="true" focusable="false">
  <title>Noch keine Reisen</title>
  <desc>Leerzustand „Meine Reisen“ (W04, F-044): ein Koffer vor der aufgehenden Sonne über Minze-Wellen, in einer Lavendel-Kachel. Dekorativ.</desc>
  <!-- v1.0, Stil B: flach, ohne Kontur, Kachel statt Teller, max. 5 Palettenfarben. Ebenen (M-D3): plate, sun, sea, suitcase. -->
  <style>
    .wi-plate { fill: var(--ww-illu-plate, #ECE6FF); }
    .wi-brand { fill: var(--ww-illu-brand, #2B2266); }
    .wi-violet { fill: var(--ww-illu-violet, #5B48C9); }
    .wi-mint { fill: var(--ww-illu-mint, #52E5B8); }
    .wi-mintd { fill: var(--ww-illu-mint-deep, #1FBF94); }
    .wi-sun { fill: var(--ww-illu-sun, #FFCF4A); }
    .wi-coral { fill: var(--ww-illu-coral, #F0503F); }
    .wi-s-brand { stroke: var(--ww-illu-brand, #2B2266); }
    @media (prefers-color-scheme: dark) {
      .wi-plate { fill: var(--ww-illu-plate, #221C4A); }
      .wi-brand { fill: var(--ww-illu-brand, #5B48C9); }
      .wi-violet { fill: var(--ww-illu-violet, #A79AF2); }
      .wi-coral { fill: var(--ww-illu-coral, #FF8A7A); }
      .wi-s-brand { stroke: var(--ww-illu-brand, #5B48C9); }
    }
  </style>
  <defs>
    <clipPath id="wwet-plate"><rect x="28" y="12" width="184" height="156" rx="32"/></clipPath>
  </defs>
  <g data-anim="plate"><rect class="wi-plate" x="28" y="12" width="184" height="156" rx="32"/></g>
  <g clip-path="url(#wwet-plate)">
    <g data-anim="sun">
      <circle class="wi-sun" cx="160" cy="92" r="34" opacity=".3"/>
      <circle class="wi-sun" cx="160" cy="92" r="22"/>
    </g>
    <g data-anim="sea">
      <path class="wi-mint" d="M28 118c18-6 36-6 54 0s36 6 54 0 36-6 54 0 22 4 30 2v50H28z"/>
      <path class="wi-mintd" d="M28 136c18-5 36-5 54 0s36 5 54 0 36-5 54 0 22 4 30 2v30H28z"/>
    </g>
  </g>
  <g data-anim="suitcase">
    <path class="wi-s-brand" d="M86 84v-9a5 5 0 0 1 5-5h18a5 5 0 0 1 5 5v9" fill="none" stroke-width="5" stroke-linecap="round"/>
    <rect class="wi-coral" x="64" y="84" width="72" height="56" rx="12"/>
    <rect class="wi-brand" x="80" y="84" width="6" height="56" opacity=".25"/>
    <rect class="wi-brand" x="114" y="84" width="6" height="56" opacity=".25"/>
    <circle class="wi-sun" cx="100" cy="110" r="8"/>
  </g>
</svg>
