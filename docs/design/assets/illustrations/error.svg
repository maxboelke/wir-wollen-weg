<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" aria-hidden="true" focusable="false">
  <title>Hier ging etwas schief</title>
  <desc>Fehlerseiten W14 (Link ungültig, Reise nicht gefunden, 404, Serverfehler): eine Kalenderkarte mit eingerissener Ecke und eine Sonne hinter einer Wolke – ruhig, nicht alarmierend, kein Rot. Dekorativ.</desc>
  <!-- v1.0, Stil B. Ruhe-Bereich (E0): höchstens Überblenden. Ebenen (M-D3): plate, calendar, cloud. -->
  <style>
    .wi-plate { fill: var(--ww-illu-plate, #ECE6FF); }
    .wi-paper { fill: var(--ww-illu-paper, #FFFFFF); }
    .wi-lav { fill: var(--ww-illu-lavender, #A79AF2); }
    .wi-lavl { fill: var(--ww-illu-lavender-light, #D6CFFA); }
    .wi-brand { fill: var(--ww-illu-brand, #2B2266); }
    .wi-sun { fill: var(--ww-illu-sun, #FFCF4A); }
    @media (prefers-color-scheme: dark) {
      .wi-plate { fill: var(--ww-illu-plate, #221C4A); }
      .wi-paper { fill: var(--ww-illu-paper, #2E2860); }
      .wi-lavl { fill: var(--ww-illu-lavender-light, #362C7A); }
      .wi-brand { fill: var(--ww-illu-brand, #5B48C9); }
    }
  </style>
  <g data-anim="plate"><rect class="wi-plate" x="28" y="12" width="184" height="156" rx="32"/></g>
  <g data-anim="calendar">
    <path class="wi-paper" d="M66 58h96a14 14 0 0 1 14 14v34l-22 22H66a14 14 0 0 1-14-14V72a14 14 0 0 1 14-14z"/>
    <path class="wi-lavl" d="M176 106l-22 22v-12a10 10 0 0 1 10-10z"/>
    <rect class="wi-brand" x="66" y="70" width="58" height="8" rx="4"/>
    <g class="wi-lavl"><rect x="66" y="88" width="22" height="18" rx="6"/><rect x="93" y="88" width="22" height="18" rx="6"/><rect x="120" y="88" width="22" height="18" rx="6"/><rect x="66" y="110" width="22" height="10" rx="5"/></g>
    <rect class="wi-lav" x="80" y="50" width="7" height="14" rx="3.5"/>
    <rect class="wi-lav" x="140" y="50" width="7" height="14" rx="3.5"/>
  </g>
  <g data-anim="cloud">
    <circle class="wi-sun" cx="176" cy="44" r="16"/>
    <path class="wi-paper" d="M150 56a10 10 0 0 1 18-6 12 12 0 0 1 22 4 8 8 0 0 1 0 16h-38a7 7 0 0 1-2-14z"/>
  </g>
</svg>
