<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" aria-hidden="true" focusable="false">
  <title>Noch keine Unterkünfte</title>
  <desc>Leerzustand „Unterkünfte“ (W18 E.3, F-031): ein kleines Ferienhaus mit Sonne über Minze-Wellen, daneben eine Vorschlagskarte mit Herz, in einer Lavendel-Kachel. Dekorativ.</desc>
  <!-- v1.1 (2026-10-23), Stil B: flach, ohne Kontur, Kachel statt Teller, max. 5 Palettenfarben. Ebenen (M-D3): plate, sun, sea, house, card, sparks. -->
  <style>
    .wi-plate { fill: var(--ww-illu-plate, #ECE6FF); }
    .wi-paper { fill: var(--ww-illu-paper, #FFFFFF); }
    .wi-brand { fill: var(--ww-illu-brand, #2B2266); }
    .wi-violet { fill: var(--ww-illu-violet, #5B48C9); }
    .wi-mint { fill: var(--ww-illu-mint, #52E5B8); }
    .wi-mintd { fill: var(--ww-illu-mint-deep, #1FBF94); }
    .wi-sun { fill: var(--ww-illu-sun, #FFCF4A); }
    .wi-coral { fill: var(--ww-illu-coral, #F0503F); }
    @media (prefers-color-scheme: dark) {
      .wi-plate { fill: var(--ww-illu-plate, #221C4A); }
      .wi-paper { fill: var(--ww-illu-paper, #2E2860); }
      .wi-brand { fill: var(--ww-illu-brand, #5B48C9); }
      .wi-violet { fill: var(--ww-illu-violet, #A79AF2); }
      .wi-coral { fill: var(--ww-illu-coral, #FF8A7A); }
    }
  </style>
  <defs>
    <clipPath id="wwes-plate"><rect x="28" y="12" width="184" height="156" rx="32"/></clipPath>
  </defs>
  <g data-anim="plate"><rect class="wi-plate" x="28" y="12" width="184" height="156" rx="32"/></g>
  <g clip-path="url(#wwes-plate)">
    <g data-anim="sun">
      <circle class="wi-sun" cx="74" cy="56" r="26" opacity=".3"/>
      <circle class="wi-sun" cx="74" cy="56" r="16"/>
    </g>
    <g data-anim="sea">
      <path class="wi-mint" d="M28 128c18-6 36-6 54 0s36 6 54 0 36-6 54 0 22 4 30 2v40H28z"/>
      <path class="wi-mintd" d="M28 146c18-5 36-5 54 0s36 5 54 0 36-5 54 0 22 4 30 2v22H28z"/>
    </g>
  </g>
  <g data-anim="house">
    <rect class="wi-paper" x="62" y="88" width="64" height="44" rx="4"/>
    <path class="wi-coral" d="M54 92l40-26 40 26z"/>
    <rect class="wi-brand" x="86" y="106" width="16" height="26" rx="8"/>
    <rect class="wi-violet" x="68" y="100" width="12" height="12" rx="3"/>
    <rect class="wi-violet" x="108" y="100" width="12" height="12" rx="3"/>
  </g>
  <g data-anim="card">
    <g transform="rotate(8 166 82)">
      <rect class="wi-paper" x="138" y="52" width="56" height="60" rx="10"/>
      <rect class="wi-violet" x="138" y="52" width="56" height="28" rx="10" opacity=".35"/>
      <rect class="wi-violet" x="146" y="88" width="30" height="5" rx="2.5"/>
      <rect class="wi-violet" x="146" y="98" width="20" height="5" rx="2.5" opacity=".5"/>
      <circle class="wi-mint" cx="190" cy="54" r="12"/>
      <path class="wi-brand" d="M190 61s-6-3.5-6-7.7a3.1 3.1 0 0 1 6-1.4 3.1 3.1 0 0 1 6 1.4c0 4.2-6 7.7-6 7.7z"/>
    </g>
  </g>
  <g data-anim="sparks">
    <path class="wi-sun" d="M128 34l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
    <path class="wi-violet" d="M200 128l1.5 3.5 3.5 1.5-3.5 1.5-1.5 3.5-1.5-3.5-3.5-1.5 3.5-1.5z"/>
  </g>
</svg>
