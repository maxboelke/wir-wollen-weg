<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" aria-hidden="true" focusable="false">
  <title>Einladung</title>
  <desc>Kleine Einladungs-Illustration (W03, F-003, Fallback ohne Reisekarte, z. B. in Mails oder Fehlerfällen): eine gekippte Indigo-Reisekarte mit Abendsonne und Minze-Wellen, daneben ein Papierflieger. Keine Namen oder Initialen. Dekorativ.</desc>
  <!-- v1.0, Stil B. In W03 selbst ist die HTML-Reisekarte mit trip-card-motif.svg führend.
       Ebenen (M-D3): letter (Karte gleitet ein), plane (Flieger). Gekippte Gruppen liegen in äußeren data-anim-Gruppen. -->
  <style>
    .wi-plate { fill: var(--ww-illu-plate, #ECE6FF); }
    .wi-brand { fill: var(--ww-illu-brand, #2B2266); }
    .wi-violet { fill: var(--ww-illu-violet, #5B48C9); }
    .wi-mint { fill: var(--ww-illu-mint, #52E5B8); }
    .wi-mintd { fill: var(--ww-illu-mint-deep, #1FBF94); }
    .wi-sun { fill: var(--ww-illu-sun, #FFCF4A); }
    .wi-onb { fill: var(--ww-illu-on-brand, #FFFFFF); }
    .wi-paper { fill: var(--ww-illu-paper, #FFFFFF); }
    .wi-s-brand { stroke: var(--ww-illu-brand, #2B2266); }
    @media (prefers-color-scheme: dark) {
      .wi-plate { fill: var(--ww-illu-plate, #221C4A); }
      .wi-brand { fill: var(--ww-illu-brand, #5B48C9); }
      .wi-violet { fill: var(--ww-illu-violet, #A79AF2); }
      .wi-paper { fill: var(--ww-illu-paper, #2E2860); }
      .wi-s-brand { stroke: var(--ww-illu-brand, #5B48C9); }
    }
  </style>
  <defs>
    <clipPath id="wwinv-card"><rect x="40" y="34" width="140" height="92" rx="16"/></clipPath>
  </defs>
  <rect class="wi-plate" x="20" y="8" width="200" height="144" rx="32"/>
  <g data-anim="letter">
    <g transform="rotate(-6 110 80)">
      <rect class="wi-brand" x="40" y="34" width="140" height="92" rx="16"/>
      <g clip-path="url(#wwinv-card)">
        <circle class="wi-sun" cx="150" cy="62" r="24" opacity=".25"/>
        <circle class="wi-sun" cx="150" cy="62" r="15"/>
        <path class="wi-mint" d="M40 108c15-5 30-5 45 0s30 5 45 0 30-5 50 0v20H40z"/>
        <path class="wi-mintd" d="M40 117c15-4 30-4 45 0s30 4 45 0 30-4 50 0v12H40z"/>
      </g>
      <rect class="wi-onb" x="54" y="50" width="52" height="8" rx="4" opacity=".9"/>
      <rect class="wi-onb" x="54" y="64" width="34" height="6" rx="3" opacity=".55"/>
      <g class="wi-onb" opacity=".8"><circle cx="60" cy="88" r="5"/><circle cx="72" cy="88" r="5"/><circle cx="84" cy="88" r="5"/></g>
    </g>
  </g>
  <g data-anim="plane">
    <g transform="rotate(-18 196 40)">
      <path class="wi-paper" d="M176 42l40-14-14 36-8-14z"/>
      <path class="wi-s-brand" d="M176 42l40-14-14 36-8-14zM194 50l22-22" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
  </g>
</svg>
