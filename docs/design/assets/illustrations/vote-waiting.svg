<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" role="img" aria-labelledby="t d">
  <title id="t">Abstimmung noch nicht gestartet</title>
  <desc id="d">Eine Wahlurne mit halb eingeworfenem Zettel und einer Uhr – es wird noch gewartet. Für den leeren Abstimmungs-Tab (W10, F-010/F-011).</desc>
  <style>
    .plate { fill: var(--ww-illu-plate, #ECE5D9); }
    .paper { fill: var(--ww-illu-paper, #FFFFFF); }
    .inkS  { stroke: var(--ww-illu-ink, #1C2526); }
    .ink   { fill: var(--ww-illu-ink, #1C2526); }
    .teal  { fill: var(--ww-illu-teal, #0E6A68); }
    .tealL { fill: var(--ww-illu-teal-light, #A6DBD2); }
    .sun   { fill: var(--ww-illu-sun, #F4B942); }
    @media (prefers-color-scheme: dark) {
      .plate { fill: var(--ww-illu-plate, #1A2324); }
      .paper { fill: var(--ww-illu-paper, #232E2F); }
      .inkS  { stroke: var(--ww-illu-ink, #ECF1F0); }
      .ink   { fill: var(--ww-illu-ink, #ECF1F0); }
      .teal  { fill: var(--ww-illu-teal, #5FC9BA); }
      .tealL { fill: var(--ww-illu-teal-light, #1D4B46); }
      .sun   { fill: var(--ww-illu-sun, #F2C46B); }
    }
  </style>
  <circle class="plate" cx="80" cy="62" r="52"/>
  <!-- Zettel -->
  <rect class="paper inkS" x="64" y="30" width="30" height="38" rx="3" stroke-width="2"/>
  <path class="inkS" d="M70 40h18M70 47h12" stroke-width="2" stroke-linecap="round"/>
  <!-- Urne -->
  <rect class="teal" x="42" y="62" width="76" height="40" rx="6"/>
  <rect class="ink" x="60" y="60" width="40" height="6" rx="3"/>
  <rect class="tealL" x="54" y="78" width="52" height="5" rx="2.5"/>
  <!-- Uhr -->
  <circle class="sun" cx="116" cy="40" r="15"/>
  <path class="inkS" d="M116 32v8l5 3" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
