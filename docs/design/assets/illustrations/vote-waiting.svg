<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" aria-hidden="true" focusable="false">
  <title>Abstimmung noch nicht gestartet</title>
  <desc>W10: drei gestapelte Abstimmungskarten mit leeren Ja-, Vielleicht- und Nein-Feldern, davor eine Uhr in einer Sonnen-Kachel. Dekorativ.</desc>
  <!-- v1.0, Stil B. Ebenen (M-D3): plate, cards, clock. -->
  <style>
    .wi-plate { fill: var(--ww-illu-plate, #ECE6FF); }
    .wi-paper { fill: var(--ww-illu-paper, #FFFFFF); }
    .wi-lav { fill: var(--ww-illu-lavender, #A79AF2); }
    .wi-lavl { fill: var(--ww-illu-lavender-light, #D6CFFA); }
    .wi-brand { fill: var(--ww-illu-brand, #2B2266); }
    .wi-sun { fill: var(--ww-illu-sun, #FFCF4A); }
    @media (prefers-color-scheme: dark) {
      .wi-plate { fill: var(--ww-illu-plate, #221C4A); }
      .wi-paper { fill: var(--ww-illu-paper, #2E2860); }
      .wi-lavl { fill: var(--ww-illu-lavender-light, #362C7A); }
      .wi-brand { fill: var(--ww-illu-brand, #5B48C9); }
    }
  </style>
  <g data-anim="plate"><rect class="wi-plate" x="28" y="12" width="184" height="156" rx="32"/></g>
  <g data-anim="cards">
    <rect class="wi-lav" x="66" y="34" width="120" height="70" rx="16" opacity=".5"/>
    <rect class="wi-lavl" x="58" y="44" width="124" height="74" rx="16"/>
    <rect class="wi-paper" x="50" y="56" width="128" height="82" rx="18"/>
    <rect class="wi-brand" x="64" y="70" width="64" height="8" rx="4"/>
    <g class="wi-lavl"><rect x="64" y="96" width="30" height="28" rx="9"/><rect x="99" y="96" width="30" height="28" rx="9"/><rect x="134" y="96" width="30" height="28" rx="9"/></g>
  </g>
  <g data-anim="clock">
    <rect class="wi-sun" x="152" y="108" width="44" height="44" rx="14"/>
    <circle cx="174" cy="130" r="12" fill="none" stroke="#1E1A3D" stroke-width="3"/>
    <path d="M174 123v7l4.5 3" fill="none" stroke="#1E1A3D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
