<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 96" width="120" height="96" aria-hidden="true" focusable="false">
  <title>Code ist unterwegs</title>
  <desc>W02/W03 (F-040/F-041): ein Brief in einer Lavendel-Kachel, oben rechts ein Minze-Siegel mit Häkchen, oben links ein Sonnen-Funkel. Dekorativ.</desc>
  <!-- v1.0, Stil B, klein (≤ 96 px). Ruhe-Bereich (E0): nur Überblenden, höchstens Brief gleitet 8 px.
       Ebenen (M-D3): plate, letter, seal, sparks. -->
  <style>
    .wi-plate { fill: var(--ww-illu-plate, #ECE6FF); }
    .wi-paper { fill: var(--ww-illu-paper, #FFFFFF); }
    .wi-lavl { fill: var(--ww-illu-lavender-light, #D6CFFA); }
    .wi-mint { fill: var(--ww-illu-mint, #52E5B8); }
    .wi-sun { fill: var(--ww-illu-sun, #FFCF4A); }
    .wi-s-violet { stroke: var(--ww-illu-violet, #5B48C9); }
    .wi-s-seal { stroke: var(--ww-seal-fg, #2B2266); }
    @media (prefers-color-scheme: dark) {
      .wi-plate { fill: var(--ww-illu-plate, #221C4A); }
      .wi-paper { fill: var(--ww-illu-paper, #2E2860); }
      .wi-lavl { fill: var(--ww-illu-lavender-light, #362C7A); }
      .wi-s-violet { stroke: var(--ww-illu-violet, #A79AF2); }
      .wi-s-seal { stroke: var(--ww-seal-fg, #14112E); }
    }
  </style>
  <g data-anim="plate"><rect class="wi-plate" x="6" y="10" width="100" height="78" rx="26"/></g>
  <g data-anim="letter">
    <rect class="wi-paper" x="24" y="28" width="66" height="46" rx="10"/>
    <path class="wi-s-violet" d="M28 34l29 21 29-21" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="wi-lavl"><circle cx="40" cy="66" r="3"/><circle cx="50" cy="66" r="3"/><circle cx="60" cy="66" r="3"/></g>
  </g>
  <g data-anim="seal">
    <circle class="wi-mint" cx="94" cy="26" r="15"/>
    <path class="wi-s-seal" d="M87 26.5l4.5 4.5 8-8.5" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g data-anim="sparks">
    <path class="wi-sun" d="M14 8l1.8 4.4 4.4 1.8-4.4 1.8-1.8 4.4-1.8-4.4-4.4-1.8 4.4-1.8z"/>
  </g>
</svg>
