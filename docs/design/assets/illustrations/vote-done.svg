<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" aria-hidden="true" focusable="false">
  <title>Termin steht fest</title>
  <desc>Kompakte Form des Vorfreude-Rings (F-012) für Stellen ohne Cockpit, z. B. Reisekarte in Meine Reisen, Mail oder Teilen-Bild: Indigo-Kachel mit Ring von Minze nach Sonne, Sonnenpunkt an der Spitze, Konfetti. Dekorativ.</desc>
  <!-- v1.0. Die Feier selbst (W11) nutzt countdown-ring.svg im Cockpit. Hier dieselben Ebenen, kleiner:
       backdrop, glow, track, ring (pathLength 100, dashoffset 100 → 0), knob (äußere Gruppe dreht um 120px 90px
       von −347° auf 0°), confetti (data-piece 1–6). Mitte frei für eine HTML-Zahl, falls gewünscht. IDs Präfix wwvd. -->
  <defs>
    <linearGradient id="wwvd-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#52E5B8"/>
      <stop offset="1" stop-color="#FFCF4A"/>
    </linearGradient>
  </defs>
  <g data-anim="backdrop"><rect x="28" y="12" width="184" height="156" rx="32" fill="#2B2266"/></g>
  <g data-anim="glow"><circle cx="120" cy="90" r="62" fill="#FFCF4A" opacity=".12"/></g>
  <g data-anim="confetti">
    <g data-piece="1"><rect x="48" y="40" width="7" height="12" rx="2.5" fill="#52E5B8" transform="rotate(-24 51 46)"/></g>
    <g data-piece="2"><circle cx="58" cy="128" r="4" fill="#A79AF2"/></g>
    <g data-piece="3"><rect x="184" y="44" width="7" height="12" rx="2.5" fill="#FFCF4A" transform="rotate(22 187 50)"/></g>
    <g data-piece="4"><circle cx="190" cy="132" r="4" fill="#F0503F"/></g>
    <g data-piece="5"><rect x="176" y="100" width="6" height="10" rx="2.5" fill="#FFFFFF" transform="rotate(30 179 105)"/></g>
    <g data-piece="6"><path d="M66 82l1.8 4.2 4.2 1.8-4.2 1.8-1.8 4.2-1.8-4.2-4.2-1.8 4.2-1.8z" fill="#FFCF4A"/></g>
  </g>
  <g data-anim="track"><circle cx="120" cy="90" r="44" fill="none" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="10"/></g>
  <g data-anim="ring">
    <path d="M120 46a44 44 0 1 1 0 88a44 44 0 1 1 0-88" pathLength="100" fill="none" stroke="url(#wwvd-grad)" stroke-width="10" stroke-linecap="round" stroke-dasharray="96.5 100"/>
  </g>
  <g data-anim="knob">
    <g transform="rotate(347 120 90)">
      <circle cx="120" cy="46" r="7.5" fill="#FFCF4A" stroke="#2B2266" stroke-width="2.5"/>
    </g>
  </g>
</svg>
