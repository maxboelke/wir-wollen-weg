<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" aria-hidden="true" focusable="false">
  <title>Keine Treffer</title>
  <desc>Leerzustand Vorschläge (W09, F-009): zwei Zeitraum-Balken, die sich nicht überlappen, darüber eine Lupe mit Funkel – hier passt gerade nichts zusammen. Dekorativ.</desc>
  <!-- v1.0, Stil B. Ebenen (M-D3): plate, ranges, search. -->
  <style>
    .wi-plate { fill: var(--ww-illu-plate, #ECE6FF); }
    .wi-paper { fill: var(--ww-illu-paper, #FFFFFF); }
    .wi-lav { fill: var(--ww-illu-lavender, #A79AF2); }
    .wi-violet { fill: var(--ww-illu-violet, #5B48C9); }
    .wi-mint { fill: var(--ww-illu-mint, #52E5B8); }
    .wi-sun { fill: var(--ww-illu-sun, #FFCF4A); }
    .wi-s-ink { stroke: var(--ww-illu-ink, #1E1A3D); }
    @media (prefers-color-scheme: dark) {
      .wi-plate { fill: var(--ww-illu-plate, #221C4A); }
      .wi-paper { fill: var(--ww-illu-paper, #2E2860); }
      .wi-violet { fill: var(--ww-illu-violet, #A79AF2); }
      .wi-s-ink { stroke: var(--ww-illu-ink, #F3F1FF); }
    }
  </style>
  <g data-anim="plate"><rect class="wi-plate" x="28" y="12" width="184" height="156" rx="32"/></g>
  <g data-anim="ranges">
    <rect class="wi-paper" x="48" y="100" width="144" height="48" rx="14"/>
    <rect class="wi-lav" x="60" y="112" width="58" height="10" rx="5"/>
    <rect class="wi-violet" x="126" y="128" width="54" height="10" rx="5"/>
  </g>
  <g data-anim="search">
    <circle class="wi-paper" cx="112" cy="66" r="26"/>
    <circle class="wi-s-ink" cx="112" cy="66" r="20" fill="none" stroke-width="6"/>
    <path class="wi-s-ink" d="M127 81l16 16" fill="none" stroke-width="8" stroke-linecap="round"/>
    <path class="wi-sun" d="M160 34l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/>
    <circle class="wi-mint" cx="70" cy="44" r="5"/>
  </g>
</svg>
