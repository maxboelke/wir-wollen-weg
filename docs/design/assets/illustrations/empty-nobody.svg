<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" role="img" aria-labelledby="t d">
  <title id="t">Noch niemand eingetragen</title>
  <desc id="d">Ein leerer Kalender mit gestrichelten Tagen, darunter drei gestrichelte Platzhalter-Personen; ein Papierflieger mit Einladung ist unterwegs. Leerzustand für Heatmap und Teilnahmestatus (F-007, F-008).</desc>
  <style>
    .plate { fill: var(--ww-illu-plate, #ECE5D9); }
    .paper { fill: var(--ww-illu-paper, #FFFFFF); }
    .head  { fill: var(--ww-illu-teal, #0E6A68); }
    .ring  { fill: var(--ww-illu-paper, #FFFFFF); stroke: var(--ww-illu-teal-dark, #08403F); }
    .dash  { stroke: var(--ww-illu-subtle, #858C8A); }
    .plane { fill: var(--ww-illu-coral, #E8694A); }
    .fold  { stroke: var(--ww-illu-coral-dark, #B23F22); }
    .route { stroke: var(--ww-illu-teal, #0E6A68); }
    .inkS  { stroke: var(--ww-illu-ink, #1C2526); }
    @media (prefers-color-scheme: dark) {
      .plate { fill: var(--ww-illu-plate, #1A2324); }
      .paper { fill: var(--ww-illu-paper, #232E2F); }
      .head  { fill: var(--ww-illu-teal, #5FC9BA); }
      .ring  { fill: var(--ww-illu-paper, #232E2F); stroke: var(--ww-illu-teal-dark, #5FC9BA); }
      .dash  { stroke: var(--ww-illu-subtle, #6B7775); }
      .plane { fill: var(--ww-illu-coral, #F28A6E); }
      .fold  { stroke: var(--ww-illu-coral-dark, #B23F22); }
      .route { stroke: var(--ww-illu-teal, #5FC9BA); }
      .inkS  { stroke: var(--ww-illu-ink, #ECF1F0); }
    }
  </style>
  <circle class="plate" cx="120" cy="96" r="76"/>
  <!-- Kalender -->
  <rect class="paper inkS" x="62" y="58" width="116" height="90" rx="12" stroke-width="2"/>
  <path class="head" d="M63 76V70a11 11 0 0 1 11-11h92a11 11 0 0 1 11 11v6z"/>
  <rect class="ring" x="86" y="50" width="7" height="14" rx="3.5" stroke-width="2"/>
  <rect class="ring" x="147" y="50" width="7" height="14" rx="3.5" stroke-width="2"/>
  <g class="dash" fill="none" stroke-width="1.5" stroke-dasharray="3 2.5">
    <rect x="72" y="86" width="16" height="14" rx="3"/><rect x="93" y="86" width="16" height="14" rx="3"/><rect x="114" y="86" width="16" height="14" rx="3"/><rect x="135" y="86" width="16" height="14" rx="3"/><rect x="156" y="86" width="16" height="14" rx="3"/>
    <rect x="72" y="106" width="16" height="14" rx="3"/><rect x="93" y="106" width="16" height="14" rx="3"/><rect x="114" y="106" width="16" height="14" rx="3"/><rect x="135" y="106" width="16" height="14" rx="3"/><rect x="156" y="106" width="16" height="14" rx="3"/>
    <rect x="72" y="126" width="16" height="14" rx="3"/><rect x="93" y="126" width="16" height="14" rx="3"/><rect x="114" y="126" width="16" height="14" rx="3"/><rect x="135" y="126" width="16" height="14" rx="3"/><rect x="156" y="126" width="16" height="14" rx="3"/>
  </g>
  <!-- Platzhalter-Personen -->
  <g class="dash" stroke-width="2" stroke-dasharray="3.5 3">
    <circle class="paper" cx="96" cy="162" r="10"/>
    <circle class="paper" cx="120" cy="162" r="10"/>
    <circle class="paper" cx="144" cy="162" r="10"/>
  </g>
  <!-- Papierflieger mit Route -->
  <path class="route" d="M34 66c18-20 46-24 66-14 14 7 30 2 42-14" fill="none" stroke-width="3" stroke-linecap="round" stroke-dasharray="0 8" transform="translate(40 -20)"/>
  <path class="plane" d="M184 22l32-10-12 30-7-11z"/>
  <path class="fold" d="M197 31l19-19" fill="none" stroke-width="2" stroke-linecap="round"/>
</svg>
