<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" aria-hidden="true" focusable="false">
  <title>Noch niemand eingetragen</title>
  <desc>Leerzustand Gruppe/Übersicht (W07/W09, F-007/F-008): eine weiße Kalenderkarte mit gestrichelten, leeren Feldern und drei gestrichelten Avatar-Kreisen. Dekorativ.</desc>
  <!-- v1.0, Stil B. Ebenen (M-D3): plate, calendar, friends. -->
  <style>
    .wi-plate { fill: var(--ww-illu-plate, #ECE6FF); }
    .wi-paper { fill: var(--ww-illu-paper, #FFFFFF); }
    .wi-lavl { fill: var(--ww-illu-lavender-light, #D6CFFA); }
    .wi-brand { fill: var(--ww-illu-brand, #2B2266); }
    .wi-s-lav { stroke: var(--ww-illu-lavender, #A79AF2); }
    .wi-sun { fill: var(--ww-illu-sun, #FFCF4A); }
    @media (prefers-color-scheme: dark) {
      .wi-plate { fill: var(--ww-illu-plate, #221C4A); }
      .wi-paper { fill: var(--ww-illu-paper, #2E2860); }
      .wi-lavl { fill: var(--ww-illu-lavender-light, #362C7A); }
      .wi-brand { fill: var(--ww-illu-brand, #5B48C9); }
    }
  </style>
  <g data-anim="plate"><rect class="wi-plate" x="28" y="12" width="184" height="156" rx="32"/></g>
  <g data-anim="calendar">
    <rect class="wi-paper" x="52" y="40" width="136" height="104" rx="18"/>
    <rect class="wi-brand" x="66" y="54" width="54" height="8" rx="4"/>
    <g class="wi-s-lav" fill="none" stroke-width="2" stroke-dasharray="4 3">
      <rect x="66" y="74" width="22" height="20" rx="6"/><rect x="93" y="74" width="22" height="20" rx="6"/><rect x="120" y="74" width="22" height="20" rx="6"/><rect x="147" y="74" width="22" height="20" rx="6"/>
      <rect x="66" y="100" width="22" height="20" rx="6"/><rect x="93" y="100" width="22" height="20" rx="6"/><rect x="120" y="100" width="22" height="20" rx="6"/><rect x="147" y="100" width="22" height="20" rx="6"/>
    </g>
  </g>
  <g data-anim="friends">
    <g class="wi-s-lav" fill="none" stroke-width="2.5" stroke-dasharray="4 3">
      <circle cx="96" cy="152" r="11"/><circle cx="120" cy="152" r="11"/><circle cx="144" cy="152" r="11"/>
    </g>
    <circle class="wi-sun" cx="182" cy="34" r="9"/>
  </g>
</svg>
