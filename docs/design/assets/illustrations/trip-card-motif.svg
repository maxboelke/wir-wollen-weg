<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 358 196" width="358" height="196" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
  <title>Reisekarte: Abendsonne über dem Meer</title>
  <desc>Hintergrund der Einladungs-Reisekarte (W03): Indigo-Verlauf, konzentrische Bögen, Sonne rechts oben, Minze-Wellen am unteren Rand. Dekorativ.</desc>
  <!-- v1.0. Text liegt als HTML links oben (Weiß ≥ 8,6 : 1 auf dem Verlauf links); Sonne hält rechts 80 px frei,
       Wellen nur in den unteren 28 px – nie Text darauf. Keine Initialen auf der Karte (D-25, F-003).
       Ebenen (M-D3): backdrop, rings, sun, waves, sparkles. IDs mit Präfix wwtc. -->
  <defs>
    <linearGradient id="wwtc-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B2266"/>
      <stop offset=".6" stop-color="#3F2F99"/>
      <stop offset="1" stop-color="#5B48C9"/>
    </linearGradient>
  </defs>
  <g data-anim="backdrop">
    <rect width="358" height="196" rx="26" fill="url(#wwtc-grad)"/>
  </g>
  <g data-anim="rings" fill="none" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="2">
    <circle cx="312" cy="62" r="46"/><circle cx="312" cy="62" r="66"/><circle cx="312" cy="62" r="88"/>
  </g>
  <g data-anim="sun">
    <circle cx="312" cy="62" r="38" fill="#FFCF4A" opacity=".2"/>
    <circle cx="312" cy="62" r="27" fill="#FFCF4A"/>
  </g>
  <g data-anim="waves">
    <path d="M0 176C40 168 80 168 120 176S200 184 240 176S320 168 358 174V196H0Z" fill="#52E5B8"/>
    <path d="M0 187C46 181 92 181 138 187S230 193 276 187S334 182 358 185V196H0Z" fill="#1FBF94"/>
  </g>
  <g data-anim="sparkles">
    <path d="M250 112l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#FFFFFF" opacity=".85"/>
    <path d="M222 30l1.4 3.4 3.4 1.4-3.4 1.4-1.4 3.4-1.4-3.4-3.4-1.4 3.4-1.4z" fill="#52E5B8"/>
  </g>
</svg>
