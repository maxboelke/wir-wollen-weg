<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" aria-hidden="true" focusable="false">
  <title>Auf Wiedersehen</title>
  <desc>Konto gelöscht (W14, F-043): die Sonne geht über Minze-Wellen unter, ein kleiner Flieger zieht davon. Dekorativ.</desc>
  <!-- v1.0, Stil B. Ruhe-Bereich (E0). Ebenen (M-D3): plate, sun, sea, plane. -->
  <style>
    .wi-plate { fill: var(--ww-illu-plate, #ECE6FF); }
    .wi-paper { fill: var(--ww-illu-paper, #FFFFFF); }
    .wi-mint { fill: var(--ww-illu-mint, #52E5B8); }
    .wi-mintd { fill: var(--ww-illu-mint-deep, #1FBF94); }
    .wi-sun { fill: var(--ww-illu-sun, #FFCF4A); }
    .wi-s-brand { stroke: var(--ww-illu-brand, #2B2266); }
    @media (prefers-color-scheme: dark) {
      .wi-plate { fill: var(--ww-illu-plate, #221C4A); }
      .wi-paper { fill: var(--ww-illu-paper, #2E2860); }
      .wi-s-brand { stroke: var(--ww-illu-brand, #5B48C9); }
    }
  </style>
  <defs>
    <clipPath id="wwgb-plate"><rect x="28" y="12" width="184" height="156" rx="32"/></clipPath>
  </defs>
  <g data-anim="plate"><rect class="wi-plate" x="28" y="12" width="184" height="156" rx="32"/></g>
  <g clip-path="url(#wwgb-plate)">
    <g data-anim="sun">
      <circle class="wi-sun" cx="120" cy="118" r="44" opacity=".25"/>
      <circle class="wi-sun" cx="120" cy="118" r="30"/>
    </g>
    <g data-anim="sea">
      <path class="wi-mint" d="M28 122c18-6 36-6 54 0s36 6 54 0 36-6 54 0 22 4 30 2v46H28z"/>
      <path class="wi-mintd" d="M28 140c18-5 36-5 54 0s36 5 54 0 36-5 54 0 22 4 30 2v28H28z"/>
    </g>
  </g>
  <g data-anim="plane">
    <g transform="rotate(-14 170 50)">
      <path class="wi-paper" d="M152 52l34-12-12 30-7-12z"/>
      <path class="wi-s-brand" d="M152 52l34-12-12 30-7-12zM167 58l19-18" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
    <path class="wi-s-brand" d="M140 66c-10 6-22 8-34 4" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0 7" opacity=".6"/>
  </g>
</svg>
