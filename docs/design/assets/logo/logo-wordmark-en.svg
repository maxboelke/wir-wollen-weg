<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" width="320" height="72" role="img" aria-labelledby="t d">
  <title id="t">When do we go?</title>
  <desc id="d">English wordmark: calendar-sun symbol followed by the name "When do we go?", with "go?" set in the brand colour.</desc>
  <style>
    .ww-ink { fill: #1C2526; }
    .ww-accent { fill: #0E6A68; }
    @media (prefers-color-scheme: dark) {
      .ww-ink { fill: #ECF1F0; }
      .ww-accent { fill: #5FC9BA; }
    }
    .ww-word { font-family: Figtree, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 750; font-size: 30px; letter-spacing: -0.01em; }
  </style>
  <!-- Bildmarke A, 56 px, identisch zur DE-Wortmarke (gleiche Box 320 x 72, kein Layoutsprung beim Sprachwechsel) -->
  <g transform="translate(2 6) scale(0.875)">
    <defs>
      <clipPath id="ww-wmen-body">
        <rect x="6" y="10" width="52" height="48" rx="12"/>
      </clipPath>
    </defs>
    <rect x="6" y="10" width="52" height="48" rx="12" fill="#0E6A68"/>
    <g clip-path="url(#ww-wmen-body)">
      <circle cx="32" cy="42" r="13" fill="#F4B942"/>
      <path d="M0 44c8-4 16-4 24 0s16 4 24 0 12-4 16-2v22H0z" fill="#08403F"/>
      <path d="M0 52c8-3 16-3 24 0s16 3 24 0 12-3 16-1v13H0z" fill="#0B4F4A"/>
    </g>
    <rect x="18" y="4" width="6" height="12" rx="3" fill="#FBF8F3" stroke="#08403F" stroke-width="2"/>
    <rect x="40" y="4" width="6" height="12" rx="3" fill="#FBF8F3" stroke="#08403F" stroke-width="2"/>
  </g>
  <!-- Wortmarke EN: "go?" in Markenfarbe, Fragezeichen ohne Leerzeichen direkt am "o" (englische Typografie), gleiche Farbe wie "go".
       Vor Produktion in Pfade umwandeln (Outline); dabei Kerning-Paar "o?" optisch pruefen. -->
  <text x="70" y="46" class="ww-word"><tspan class="ww-ink">When do we </tspan><tspan class="ww-accent">go?</tspan></text>
</svg>
