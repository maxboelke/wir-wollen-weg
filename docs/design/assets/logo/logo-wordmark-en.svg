<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" width="320" height="72" role="img" aria-labelledby="wwwmen-t wwwmen-d">
  <title id="wwwmen-t">When do we go?</title>
  <desc id="wwwmen-d">English wordmark: calendar-sun symbol followed by the name "When do we go?", with "go?" set in the brand colour.</desc>
  <style>
    .wwwmen-ink { fill: #1E1A3D; }
    .wwwmen-accent { fill: #5A3FD0; }
    .wwwmen-sheet { fill: #2B2266; }
    .wwwmen-ring { fill: #A79AF2; }
    @media (prefers-color-scheme: dark) {
      .wwwmen-ink { fill: #F3F1FF; }
      .wwwmen-accent { fill: #52E5B8; }
      .wwwmen-sheet { fill: #5B48C9; }
      .wwwmen-ring { fill: #FFFFFF; }
    }
    .wwwmen-word { font-family: "Plus Jakarta Sans", Figtree, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.02em; }
  </style>
  <defs>
    <clipPath id="wwwmen-clip"><rect x="6" y="11" width="52" height="47" rx="14"/></clipPath>
  </defs>
  <g transform="translate(2 6) scale(0.875)">
    <rect class="wwwmen-sheet" x="6" y="11" width="52" height="47" rx="14"/>
    <g clip-path="url(#wwwmen-clip)">
      <circle cx="32" cy="42" r="19" fill="#FFCF4A" opacity=".25"/>
      <circle cx="32" cy="42" r="12" fill="#FFCF4A"/>
      <path d="M0 45C8 41 16 41 24 45S40 49 48 45S60 41 64 43V64H0Z" fill="#52E5B8"/>
      <path d="M0 52C8 49 16 49 24 52S40 55 48 52S60 49 64 51V64H0Z" fill="#1FBF94"/>
    </g>
    <rect class="wwwmen-ring" x="18" y="5" width="7" height="12" rx="3.5"/>
    <rect class="wwwmen-ring" x="39" y="5" width="7" height="12" rx="3.5"/>
  </g>
  <!-- "go?" als Einheit in Markenfarbe, Fragezeichen ohne Leerzeichen (D-19). Plus Jakarta Sans 800, 28 px.
       Vor Produktion in Pfade umwandeln; Kerning-Paar "o?" optisch pruefen. -->
  <text x="64" y="46" class="wwwmen-word"><tspan class="wwwmen-ink">When do we </tspan><tspan class="wwwmen-accent">go?</tspan></text>
</svg>
