<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 84" width="320" height="84" role="img" aria-labelledby="wwwmet-t wwwmet-d">
  <title id="wwwmet-t">When do we go? Find dates for your group trip</title>
  <desc id="wwwmet-d">English wordmark with tagline: calendar-sun symbol, the name "When do we go?" with "go?" in the brand colour, and below it "Find dates for your group trip".</desc>
  <style>
    .wwwmet-ink { fill: #1E1A3D; }
    .wwwmet-muted { fill: #57527A; }
    .wwwmet-accent { fill: #5A3FD0; }
    .wwwmet-sheet { fill: #2B2266; }
    .wwwmet-ring { fill: #A79AF2; }
    @media (prefers-color-scheme: dark) {
      .wwwmet-ink { fill: #F3F1FF; }
      .wwwmet-muted { fill: #B9B4DC; }
      .wwwmet-accent { fill: #52E5B8; }
      .wwwmet-sheet { fill: #5B48C9; }
      .wwwmet-ring { fill: #FFFFFF; }
    }
    .wwwmet-word { font-family: "Plus Jakarta Sans", Figtree, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.02em; }
    .wwwmet-tag { font-family: Figtree, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 13px; }
  </style>
  <defs>
    <clipPath id="wwwmet-clip"><rect x="6" y="11" width="52" height="47" rx="14"/></clipPath>
  </defs>
  <g transform="translate(2 6) scale(0.875)">
    <rect class="wwwmet-sheet" x="6" y="11" width="52" height="47" rx="14"/>
    <g clip-path="url(#wwwmet-clip)">
      <circle cx="32" cy="42" r="19" fill="#FFCF4A" opacity=".25"/>
      <circle cx="32" cy="42" r="12" fill="#FFCF4A"/>
      <path d="M0 45C8 41 16 41 24 45S40 49 48 45S60 41 64 43V64H0Z" fill="#52E5B8"/>
      <path d="M0 52C8 49 16 49 24 52S40 55 48 52S60 49 64 51V64H0Z" fill="#1FBF94"/>
    </g>
    <rect class="wwwmet-ring" x="18" y="5" width="7" height="12" rx="3.5"/>
    <rect class="wwwmet-ring" x="39" y="5" width="7" height="12" rx="3.5"/>
  </g>
  <!-- Mindestbreite 300 px (Untertitel ≥ 12 px). Nur Startseite W01, OG-Bild EN, Mail-Kopf – nie in der Kopfzeile. -->
  <text x="64" y="40" class="wwwmet-word"><tspan class="wwwmet-ink">When do we </tspan><tspan class="wwwmet-accent">go?</tspan></text>
  <text x="65" y="62" class="wwwmet-tag wwwmet-muted">Find dates for your group trip</text>
</svg>
