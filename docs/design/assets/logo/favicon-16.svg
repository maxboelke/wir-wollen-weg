<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" role="img" aria-labelledby="wwfav16-t">
  <title id="wwfav16-t">Wir wollen weg</title>
  <!-- Favicon 16 px (B0, stark vereinfacht, auf ganze Pixel gesetzt): Blatt, Sonne, eine gerade Minze-Kante, zwei Ringe.
       Als PNG 16 x 16 exportieren (favicon.ico), sonst gilt favicon.svg. -->
  <style>
    .sheet { fill: #2B2266; }
    .ring { fill: #A79AF2; }
    @media (prefers-color-scheme: dark) {
      .sheet { fill: #5B48C9; }
      .ring { fill: #FFFFFF; }
    }
  </style>
  <defs>
    <clipPath id="wwfav16-clip"><rect x="1" y="3" width="14" height="12" rx="3"/></clipPath>
  </defs>
  <rect class="sheet" x="1" y="3" width="14" height="12" rx="3"/>
  <g clip-path="url(#wwfav16-clip)">
    <circle cx="8" cy="10.5" r="3.5" fill="#FFCF4A"/>
    <rect x="0" y="11" width="16" height="5" fill="#52E5B8"/>
  </g>
  <rect class="ring" x="4" y="1" width="2" height="4" rx="1"/>
  <rect class="ring" x="10" y="1" width="2" height="4" rx="1"/>
</svg>
