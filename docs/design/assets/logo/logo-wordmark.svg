<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" width="320" height="72" role="img" aria-labelledby="wwwm-t wwwm-d">
  <title id="wwwm-t">Wir wollen weg</title>
  <desc id="wwwm-d">Wortmarke Deutsch: Bildmarke Sonnenkalender, daneben „Wir wollen weg“, das Wort „weg“ in Lavendel.</desc>
  <style>
    .wwwm-ink { fill: #1E1A3D; }
    .wwwm-accent { fill: #5A3FD0; }
    .wwwm-sheet { fill: #2B2266; }
    .wwwm-ring { fill: #A79AF2; }
    @media (prefers-color-scheme: dark) {
      .wwwm-ink { fill: #F3F1FF; }
      .wwwm-accent { fill: #52E5B8; }
      .wwwm-sheet { fill: #5B48C9; }
      .wwwm-ring { fill: #FFFFFF; }
    }
    .wwwm-word { font-family: "Plus Jakarta Sans", Figtree, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.02em; }
  </style>
  <defs>
    <clipPath id="wwwm-clip"><rect x="6" y="11" width="52" height="47" rx="14"/></clipPath>
  </defs>
  <!-- Bildmarke 56 px, gleiche Box und Lage wie die EN-Wortmarke (kein Layoutsprung beim Sprachwechsel) -->
  <g transform="translate(2 6) scale(0.875)">
    <rect class="wwwm-sheet" x="6" y="11" width="52" height="47" rx="14"/>
    <g clip-path="url(#wwwm-clip)">
      <circle cx="32" cy="42" r="19" fill="#FFCF4A" opacity=".25"/>
      <circle cx="32" cy="42" r="12" fill="#FFCF4A"/>
      <path d="M0 45C8 41 16 41 24 45S40 49 48 45S60 41 64 43V64H0Z" fill="#52E5B8"/>
      <path d="M0 52C8 49 16 49 24 52S40 55 48 52S60 49 64 51V64H0Z" fill="#1FBF94"/>
    </g>
    <rect class="wwwm-ring" x="18" y="5" width="7" height="12" rx="3.5"/>
    <rect class="wwwm-ring" x="39" y="5" width="7" height="12" rx="3.5"/>
  </g>
  <!-- Schrift: Plus Jakarta Sans 800, 28 px. Vor Produktion in Pfade umwandeln (Outline). -->
  <text x="64" y="46" class="wwwm-word"><tspan class="wwwm-ink">Wir wollen </tspan><tspan class="wwwm-accent">weg</tspan></text>
</svg>
