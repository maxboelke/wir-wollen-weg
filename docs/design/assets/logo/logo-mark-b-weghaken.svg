<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t d">
  <title id="t">Wir wollen weg – Bildmarke B „Weg-Haken“</title>
  <desc id="d">Ein Häkchen, dessen langer Strich als gepunktete Reiseroute weiterläuft und in einer Sonne endet: Entscheidung getroffen, es geht los.</desc>
  <!-- Häkchen -->
  <path d="M8 36l13 11 17-23" fill="none" stroke="#0E6A68" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Route (Punkte in Verlängerung des langen Strichs) -->
  <circle cx="41.6" cy="19.2" r="2.6" fill="#0E6A68"/>
  <circle cx="45.4" cy="14.1" r="2.2" fill="#0E6A68"/>
  <!-- Ziel-Sonne -->
  <circle cx="51" cy="7.5" r="6" fill="#E8694A"/>
</svg>
