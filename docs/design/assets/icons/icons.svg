    <path d="M12 5v14M5 12h14"/>
  </symbol>
  <symbol id="ww-icon-minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <title>Minus</title>
    <path d="M5 12h14"/>
  </symbol>
  <symbol id="ww-icon-undo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <title>Rückgängig</title>
    <path d="M9 14L4 9l5-5"/>
    <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>
  </symbol>
  <symbol id="ww-icon-range" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <title>Zeitraum wählen</title>
