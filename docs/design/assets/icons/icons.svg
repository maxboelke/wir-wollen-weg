    <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
    <path d="M3 3l18 18"/>
  </symbol>
  <symbol id="ww-icon-remind" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <title>Erinnern</title>
