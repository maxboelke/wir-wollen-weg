    <path d="M19.5 9a4 4 0 0 1 0 6"/>
    <path d="M7.5 14.5l1.5 5"/>
  </symbol>
  <symbol id="ww-icon-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <title>E-Mail</title>
    <rect x="3" y="5" width="18" height="14" rx="2.5"/>
    <path d="M3.5 7.5L12 13l8.5-5.5"/>
  </symbol>
  <symbol id="ww-icon-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <title>Gesperrt</title>
    <rect x="5" y="11" width="14" height="10" rx="2.5"/>
    <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
  </symbol>
  <symbol id="ww-icon-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <title>Frist</title>
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 7v5l3.5 2"/>
  </symbol>
  <symbol id="ww-icon-nights" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <title>Nächte</title>
    <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>
  </symbol>
  <symbol id="ww-icon-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <title>Gruppe</title>
    <circle cx="9" cy="8" r="3.5"/>
    <path d="M2.5 20a6.5 6.5 0 0 1 13 0"/>
    <path d="M16 4.7a3.5 3.5 0 0 1 0 6.6M18 14.3a6.5 6.5 0 0 1 3.5 5.7"/>
  </symbol>
  <symbol id="ww-icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <title>Person</title>
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21a8 8 0 0 1 16 0"/>
  </symbol>
  <symbol id="ww-icon-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <title>Bearbeiten</title>
    <path d="M4 20l1-4L16 5a2.1 2.1 0 0 1 3 3L8 19z"/>
    <path d="M14 7l3 3"/>
  </symbol>
  <symbol id="ww-icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <title>Löschen</title>
    <path d="M4 7h16M10 3h4"/>
    <path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/>
    <path d="M10 11v6M14 11v6"/>
  </symbol>
  <symbol id="ww-icon-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <title>Abmelden</title>
    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
    <path d="M16 17l5-5-5-5M21 12H9"/>
  </symbol>
  <symbol id="ww-icon-help" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <title>Hilfe</title>
    <circle cx="12" cy="12" r="9"/>
    <path d="M9.5 9.5a2.5 2.5 0 0 1 5 0c0 1.7-2.5 2.2-2.5 3.8"/>
    <circle cx="12" cy="16.9" r="1.1" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- Ohne Maske (Safari-sicher für externe <use>): Häkchen in --ww-icon-knockout = Hintergrundfarbe der Zelle -->
  <symbol id="ww-icon-all-available" viewBox="0 0 24 24">
    <title>Alle können</title>
    <circle cx="12" cy="12" r="10" fill="currentColor"/>
    <path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="stroke: var(--ww-icon-knockout, #ffffff)"/>
  </symbol>
</svg>
