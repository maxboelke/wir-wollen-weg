    <path d="M3 10h18M8 3v4M16 3v4"/>
    <path d="M7.5 15.5h9M7.5 13.5v4M16.5 13.5v4"/>
  </symbol>
  <symbol id="ww-icon-quick-actions" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <title>Schnellaktionen</title>
    <path d="M4 20L15 9"/>
    <path d="M17 3v2.5M17 8.5V11M13 7h2.5M18.5 7H21"/>
    <path d="M7 4v2M6 5h2"/>
