    <path d="M12 11v5"/>
    <circle cx="12" cy="7.75" r="1.1" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="ww-icon-warning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
