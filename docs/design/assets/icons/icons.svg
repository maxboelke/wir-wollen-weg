    <path d="M8 12.5l2.7 2.7L16 9.5"/>
  </symbol>
  <symbol id="ww-icon-comment" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <title>Kommentar</title>
