<!--
  Promo v2, Stil C „Reise-Abenteuer“ (Motion Designer, 2026-10-23) – verspielt: Reisekarten-Papier, Gepäckanhänger-Etiketten,
  Sticker (Illustrationen aus docs/design/assets/illustrations), Klebeband. Eine Reiseroute verbindet die vier Schritte als „Weg“
  wie im Cockpit „Reiseverlauf“: erledigt = durchgezogen, kommt noch = gestrichelt, Sonnen-Marker = „hier sind wir“.
  Die Kamera fährt die Route Station für Station nach unten.
  Storyboard: ../storyboard.md §9 · Aufnahme: ../README.md
  Bühne 360 × 640 CSS-px (× 3 = 1080 × 1920). Rein zeitbasiert, deterministisch (Route-Länge selbst berechnet, keine DOM-Messung).
  Parameter: ?lang=en · ?scene=0..8 · ?t=ms · ?pause=1 · ?loop=1 · ?debug=1 · ?scale=n
  API: window.__promoReady, __promoDone, __promoDuration, __promoRender(ms)
-->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

.c-st.sq img{width:48px;height:48px}

/* Hook */
.c-chat{position:absolute;left:34px;top:196px;z-index:5}

/* Endkarte */
#endLogo{position:absolute;left:132px;width:96px;height:96px;z-index:9;opacity:0;visibility:hidden}

  display:inline-flex;align-items:center;gap:6px;font:800 11.5px/1 var(--ww-font-sans);color:var(--ww-ink-900);white-space:nowrap;opacity:0;visibility:hidden}
#endChips span b{width:20px;height:20px;border-radius:50%;background:var(--ww-mint-400);color:var(--ww-indigo-800);display:grid;place-items:center}

(function(){

};
var X=TXT[C.LANG];

/* ---------- Zeitleiste (ms) ---------- */

var SCENES=[0,T0.paint,T0.heat,T0.vote,T0.party,T0.swipe,T0.costs,T0.settle,END].map(function(x,i){return i?x+HOOK_EXTRA:0;});

var HEADS=[['hook',0,0,3200],['paint',1,2950,6000],['heat',1,6300,9000],['vote',1,9300,11550],['party',1,11800,15400],['swipe',2,15050,19200],['costs',3,18950,23400],['settle',4,23150,27400]];

/* ---------- Route (Weltkoordinaten) ---------- */
var P=[[180,600],[120,PG+20],[34,PG+92],[30,PG+260],[40,PG+420],[30,PG+560],
  [180,PG+615],[330,2*PG+10],[326,2*PG+92],[330,2*PG+260],[322,2*PG+420],[330,2*PG+560],
  [180,2*PG+615],[30,3*PG+10],[34,3*PG+92],[30,3*PG+260],[40,3*PG+420],[30,3*PG+560],
  [180,3*PG+615],[330,4*PG+10],[326,4*PG+92],[330,4*PG+260],[322,4*PG+420],[330,4*PG+560],
  [180,4*PG+615],[180,5*PG+60],[180,5*PG+150]];
var PIN=[2,8,14,20], BOT=[5,11,17,23], FIN=26;
function q(i){return P[Math.max(0,Math.min(P.length-1,i))];}
var segs=[],d='M'+P[0][0]+' '+P[0][1];
for(var i=0;i<P.length-1;i++){
  var p0=q(i-1),p1=q(i),p2=q(i+1),p3=q(i+2);
  var c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];

}
function bz(s,u){var v=1-u;return [v*v*v*s[0][0]+3*v*v*u*s[1][0]+3*v*u*u*s[2][0]+u*u*u*s[3][0],v*v*v*s[0][1]+3*v*v*u*s[1][1]+3*v*u*u*s[2][1]+u*u*u*s[3][1]];}
var TAB=[[0,P[0][0],P[0][1]]],WL=[0],RL=0;
segs.forEach(function(s){var prev=s[0];for(var k=1;k<=48;k++){var pt=bz(s,k/48);RL+=Math.hypot(pt[0]-prev[0],pt[1]-prev[1]);TAB.push([RL,pt[0],pt[1]]);prev=pt;}WL.push(RL);});
function ptAt(l){
  if(l<=0)return [TAB[0][1],TAB[0][2]];if(l>=RL){var z=TAB[TAB.length-1];return [z[1],z[2]];}
  var lo=0,hi=TAB.length-1;while(hi-lo>1){var m=(lo+hi)>>1;if(TAB[m][0]<l)lo=m;else hi=m;}
  var a=TAB[lo],b=TAB[hi],k=(l-a[0])/(b[0]-a[0]);return [mix(a[1],b[1],k),mix(a[2],b[2],k)];

/* Marker-Fahrplan: [t, Routen-Länge, Easing] – auf der Station langsam weiter (Fortschritt), zwischen Stationen zügig */
var MK=[[0,0],[2300,0],[3200,WL[PIN[0]],E.std],[14500,WL[BOT[0]],E.lin],[15400,WL[PIN[1]],E.std],[18300,WL[BOT[1]],E.lin],[19200,WL[PIN[2]],E.std],
  [22500,WL[BOT[2]],E.lin],[23400,WL[PIN[3]],E.std],[26600,WL[BOT[3]],E.lin],[27400,WL[FIN],E.std]];

/* ---------- Aufbau ---------- */
var W=$('world'),H='';
/* Kartenflecken */
[[ -120,40,300],[220,300,280],[-90,PG+380,320],[230,2*PG+120,300],[-100,3*PG+300,300],[220,4*PG+360,300],[-60,5*PG+380,360]].forEach(function(s,i){
  H+='<div class="'+(i%2?'sunsp':'sea')+'" style="left:'+s[0]+'px;top:'+s[1]+'px;width:'+s[2]+'px;height:'+s[2]+'px"></div>';});
H+='<svg id="route" width="360" height="3840" viewBox="0 0 360 3840" aria-hidden="true">'+
  '<path d="'+d+'" fill="none" stroke="#8a86a8" stroke-opacity=".7" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 8"/>'+
  '<path id="rDone" d="'+d+'" pathLength="'+RL.toFixed(2)+'" fill="none" stroke="#00775a" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 '+(RL+10).toFixed(2)+'"/></svg>';
W.innerHTML=H;
function add(cls,html,css){var e=div(cls,html);if(css)e.style.cssText=css;W.appendChild(e);return e;}

add('c-flag',C.ic('flag',11)+X.start,'left:'+P[0][0]+'px;top:'+(P[0][1]+26)+'px');
var pins=PIN.map(function(ix,n){return add('c-pin','<span class="pa">'+(n+1)+'</span><span class="pb">'+C.ic('check',14)+'</span>','left:'+P[ix][0]+'px;top:'+P[ix][1]+'px');});
var tagEls=TAGS.map(function(tg){
  var pg=tg[0],n=tg[1],right=pg===2||pg===4;
  var html=n?'<b>'+n+'</b>'+X.steps[n-1]:X.hookTag;

  var e=add('c-tag '+(n?'mint':'sun'),html,css);
  if(n===0){e.style.marginLeft='0';e.style.left='0';e.style.right='0';e.style.width='fit-content';e.style.margin='0 auto';e.style.transformOrigin='50% 50%';}
  return {el:e,t:tg[2],r:right?3:-3};});
var headEls=HEADS.map(function(h){return add('c-head',X.head[h[0]],'top:'+(h[1]*PG+112)+'px');});

/* Hook: Gruppenchat */
var chat=PS.chat({start:300,gap:650,badge:4300});var chatW=add('c-chat','');chatW.style.top='196px';chatW.appendChild(chat.el);

/* Handys je Station */
function mkPhone(page,tapeHue){
  var w=add('c-ph','','top:'+(page*PG+178)+'px');
  var ph=PS.phone();w.appendChild(ph.el);
  var t1=div('c-tape');t1.style.cssText='left:-24px;top:4px;transform:rotate(-38deg)';
  var t2=div('c-tape');t2.style.cssText='right:-24px;top:4px;transform:rotate(38deg)';

var glow=add('c-glow','','top:'+(PG+20)+'px');
var ph1=mkPhone(1),ph2=mkPhone(2,'rgb(82 229 184/.55)'),ph3=mkPhone(3),ph4=mkPhone(4,'rgb(167 154 242/.55)');
var SC={paint:PS.SCR.paint(),heat:PS.SCR.heat(),vote:PS.SCR.vote(),party:PS.SCR.party(),swipe:PS.SCR.swipe(),costs:PS.SCR.costs(),settle:PS.SCR.settle()};
['paint','heat','vote','party'].forEach(function(n){ph1.slot.appendChild(SC[n].el);});
ph2.slot.appendChild(SC.swipe.el);ph3.slot.appendChild(SC.costs.el);ph4.slot.appendChild(SC.settle.el);
var seq1=PS.sequence([{s:SC.paint,tin:T0.paint},{s:SC.heat,tin:T0.heat,mode:'slide'},{s:SC.vote,tin:T0.vote,mode:'slide'},{s:SC.party,tin:T0.party,mode:'fade'}]);
var seq2=PS.sequence([{s:SC.swipe,tin:T0.swipe}]),seq3=PS.sequence([{s:SC.costs,tin:T0.costs}]),seq4=PS.sequence([{s:SC.settle,tin:T0.settle}]);

/* Sticker (Illustrationen) in der freien Spalte gegenüber der Route: [Datei, Seite, x, y, Drehung, Zeit, quadratisch?] */
var STK=[['submitted.svg',1,285,262,7,6000],['vote-done.svg',1,285,392,-6,T0.party+1150],
  ['empty-stays.svg',2,2,300,-7,16600],['empty-costs.svg',3,285,300,6,21000],['seal.svg',4,10,300,-8,T0.settle+900,true]];
var stEls=STK.map(function(s){return {el:add('c-st'+(s[6]?' sq':''),'<img src="'+ILL+s[0]+'" alt="">','left:'+s[2]+'px;top:'+(s[1]*PG+s[3])+'px'),r:s[4],t:s[5]};});

/* Marker „hier sind wir“ */
var mk=add('c-mk',C.ic('sun',16));

/* Endkarte (Seite 5) */
var E0=5*PG;
var eLogo=add('','');eLogo.id='endLogo';eLogo.style.top=(E0+108)+'px';eLogo.innerHTML=C.logo(96,'light','el');var ek=C.keys(eLogo);
var eWord=add('',X.word);eWord.id='endWord';eWord.style.top=(E0+222)+'px';
var eTag=add('');eTag.id='endTag';eTag.style.top=(E0+272)+'px';eTag.textContent=X.tag;
var eChips=add('',X.chips.map(function(c,i){return '<span data-k="ec'+i+'"><b>'+C.ic('check',11)+'</b>'+c+'</span>';}).join(''));eChips.id='endChips';eChips.style.top=(E0+336)+'px';
var ck=C.keys(eChips);
var eNote=add('');eNote.id='endNote';eNote.style.top=(E0+420)+'px';eNote.textContent=X.note;

/* Konfetti aus dem Ring (Handy 1: Seite 1, Maßstab .82 um 126|0) */
var conf=C.confetti($('conf'),20270710,['#52e5b8','#ffcf4a','#a79af2','#f0503f','#5b48c9']);
var BURST=T0.party+SC.party.burstAt;
conf.burst(72,BURST,54+126+(6+SC.party.ring.x-126)*.82,178+(6+SC.party.ring.y)*.82,'burst',90);
conf.burst(44,BURST+110,0,0,'rain',650);

/* ---------- render ---------- */
function camY(t){
  var y=0;
  for(var i=0;i<TR.length;i++){var r=TR[i];if(t>=r[1])y=r[3]*PG;else if(t>=r[0]){y=mix(r[2]*PG,r[3]*PG,ez(t,r[0],r[1]-r[0],E.std));break;}else break;}
  return y;
}
function near(cy,page){return Math.abs(cy-page*PG)<PG+40;}
function render(rt){
  var t=tl(rt);
  var cy=camY(t);
  W.style.transform='translateY('+(-cy).toFixed(2)+'px)';

  /* Route + Marker */
  var l=C.track(MK,t)[0];
  $('rDone').setAttribute('stroke-dasharray',l.toFixed(2)+' '+(RL+10).toFixed(2));
  var mp=ptAt(l);S(mk,{x:mp[0],y:mp[1],s:1+.08*Math.sin(rt/260)});
  /* Stationen abhaken (beim Aufbruch zur nächsten) */
  for(var p=0;p<4;p++){var td=TR[p+1][0],kd=pr(t,td,160);
    C.swap(pins[p].children[0],pins[p].children[1],kd);S(pins[p],{s:1+.3*bump(t,td,380)});}

  /* Etiketten + Überschriften */
  for(var g=0;g<tagEls.length;g++){var tg=tagEls[g],kt=ez(t,tg.t,520,E.bouncy);S(tg.el,{r:tg.r*(g?1:0)+mix(-10,0,kt)*(g?1:0),s:mix(.6,1,kt),o:pr(t,tg.t,100)});}
  for(var h=0;h<HEADS.length;h++){var hd=HEADS[h],el=headEls[h];
    if(t<hd[2]-5||t>hd[3]+5){O(el,0);continue;}
    var kin=ez(t,hd[2],520,E.soft),ko=ez(t,hd[3]-200,200,E.exit);
    S(el,{y:12*(1-kin)-8*ko,s:mix(.96,1,kin),o:pr(t,hd[2],160)*(1-ko)});}

  /* Hook */
  if(near(cy,0)){
    var cin=ez(rt,40,460,E.emph),shk=(rt>4430&&rt<4780)?Math.sin((rt-4430)/26)*2.6*(1-pr(rt,4430,350)):0;
    S(chat.el,{x:shk,y:mix(28,0,cin),s:mix(.96,1,cin),r:-2.5+shk*.5,o:pr(rt,40,200)});chat.render(rt);
  }

  /* Handys */
  S(ph1.w,{s:.82*(1+.03*bump(t,BURST,420))});
