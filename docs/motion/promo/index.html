function bez(x1,y1,x2,y2){return function(x){if(x<=0)return 0;if(x>=1)return 1;var lo=0,hi=1,t=x;
  for(var i=0;i<30;i++){t=(lo+hi)/2;var bx=3*x1*t*(1-t)*(1-t)+3*x2*t*t*(1-t)+t*t*t;if(bx<x)lo=t;else hi=t;}
  return 3*y1*t*(1-t)*(1-t)+3*y2*t*t*(1-t)+t*t*t;};}
function pl(str){var pts=str.split(',').map(function(s,i){var a=s.trim().split(/\s+/);return [a[1]!=null?parseFloat(a[1])/100:(i===0?0:1),parseFloat(a[0])];});
  return function(x){if(x<=0)return 0;if(x>=1)return 1;for(var i=1;i<pts.length;i++){if(x<=pts[i][0]){var a=pts[i-1],b=pts[i];return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]);}}return 1;};}
/* = Motion-Tokens aus tokens.css §6 / motion-system.md §3 */
var E={
  std:bez(.2,0,0,1), enter:bez(0,0,0,1), exit:bez(.3,0,1,1), emph:bez(.05,.7,.1,1),
  soft:pl('0, .052 5%, .174 10%, .325 15%, .478 20%, .619 25%, .738 30%, .833 35%, .906 40%, .991 50%, 1.024 60%, 1.028 70%, 1.021 80%, 1.013 90%, 1'),
  bouncy:pl('0, .116 5%, .372 10%, .657 15%, .898 20%, 1.061 25%, 1.145 30%, 1.163 35%, 1.139 40%, 1.095 45%, 1.049 50%, .987 60%, .974 70%, .986 80%, .999 90%, 1')
};
function cl(v,a,b){return v<a?a:v>b?b:v;}
function pr(t,t0,d){return cl((t-t0)/d,0,1);}
function ez(t,t0,d,e){return (e||E.std)(pr(t,t0,d));}
function mix(a,b,k){return a+(b-a)*k;}
function bump(t,t0,d){var k=pr(t,t0,d);return (k>0&&k<1)?Math.sin(k*Math.PI):0;}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function burst(n,t0,ox,oy,mode,spread){
  for(var i=0;i<n;i++){
    var p={t0:t0+rnd()*spread,ox:ox,oy:oy,col:CCOL[Math.floor(rnd()*5)],shape:rnd()};
    if(mode==='burst'){var a=(-90+(rnd()-.5)*170)*Math.PI/180,sp=300+rnd()*460;p.vx=Math.cos(a)*sp;p.vy=Math.sin(a)*sp;}
    else{p.ox=8+rnd()*344;p.oy=-16-rnd()*40;p.vx=(rnd()-.5)*50;p.vy=30+rnd()*90;}
    p.g=560+rnd()*180;p.k=1.7+rnd()*.9;p.spin=(rnd()-.5)*900;p.r0=rnd()*360;p.flip=7+rnd()*8;p.ph=rnd()*6.283;p.wob=3+rnd()*9;p.life=2100+rnd()*900;
    var w,h,rad;if(p.shape<.5){w=5;h=9;rad='1.5px';}else if(p.shape<.75){w=6;h=6;rad='50%';}else{w=11;h=2.6;rad='2px';}
    var el=document.createElement('i');el.className='cf';
    el.style.cssText='width:'+w+'px;height:'+h+'px;margin:'+(-h/2)+'px 0 0 '+(-w/2)+'px;background:'+p.col+';border-radius:'+rad;
    conf.appendChild(el);p.el=el;parts.push(p);

}

    p.on=true;
    var e=1-Math.exp(-p.k*dt);
    var x=p.ox+p.vx*e/p.k+Math.sin(dt*p.flip*.5+p.ph)*p.wob*Math.min(1,dt*2);

      S($('rc'),{y:16*(1-ez(t,14420,260,E.enter)),o:pr(t,14420,200)});

    /* 5 Swipen */

      var tx1=92*ez(t,18900,450,E.std)+250*ez(t,19350,300,E.exit);
      S($('cd0'),{x:tx1,y:-4*pr(t,18900,450),r:tx1*.075,o:1});
      var kl=cl((tx1-24)/36,0,1);S($('stL0'),{r:-8,s:mix(.8,1,kl),o:kl});
      var a1=ez(t,19380,380,E.soft),a2=ez(t,20160,380,E.soft);

      var d1=1-a1;S($('cd1'),{x:tx2,y:9*d1,s:1-.045*d1,r:tx2*.075});
      var kn2=pr(t,19990,140);S($('stN1'),{r:8,s:mix(.8,1,kn2),o:kn2});

    /* 6 Kosten */

      S($('stand'),{y:14*(1-ez(t,21680,420,E.emph)),o:pr(t,21680,200)});
      for(var r=0;r<4;r++){var tr0=21800+r*70;S($('xr'+r),{y:12*(1-ez(t,tr0,420,E.emph)),o:pr(t,tr0,200)});}

    /* Finger + Tipp-Wellen */
    var f=fingerAt(t);S(finger,{x:f[0],y:f[1],s:1-.18*f[3],o:f[2]});
    for(var w=0;w<TAPS.length;w++){var tp=TAPS[w],kr=pr(t,tp[0],450),rp=rips.children[w];

function voteSel(id,t0,t){
  var v=$(id),k=ez(t,t0,280,E.soft);
  S(q('.fb',v),{s:mix(.9,1,k),o:pr(t,t0,120)});
  O(q('.lb',v),1-pr(t,t0,120));O(q('.lb2',v),pr(t,t0,120));
  S(q('.tick',v),{s:mix(.6,1,ez(t,t0+60,420,E.bouncy)),o:pr(t,t0+60,100)});
  S(v,{s:1-.03*bump(t,t0-40,160)});
}
function sceneAt(t){var n=0;for(var i=0;i<SCENES.length;i++)if(t>=SCENES[i])n=i;return n;}

/* ======================= Steuerung ======================= */
var DBG=Q.get('debug')==='1';
if(DBG)$('dbg').style.display='block';
function fit(){var k=Q.get('scale')?parseFloat(Q.get('scale')):Math.min(innerWidth/360,innerHeight/640);stage.style.zoom=k;}
fit();addEventListener('resize',fit);

var start=0;
if(Q.has('scene')){var n=parseInt(Q.get('scene'),10);if(n>=0&&n<SCENES.length)start=SCENES[n];}
if(Q.has('t'))start=cl(parseInt(Q.get('t'),10)||0,0,DUR);
var paused=Q.get('pause')==='1',loop=Q.get('loop')==='1';
var cur=start,anchorNow=null,anchorT=start,running=false;
window.__promoDuration=DUR;window.__promoDone=false;window.__promoReady=false;
window.__promoScenes=SCENES.slice();
window.__promoRender=function(ms){running=false;cur=cl(+ms||0,0,DUR);render(cur);window.__promoDone=cur>=DUR;return cur;};
function tick(now){
  if(!running)return;
  if(anchorNow===null)anchorNow=now;
  cur=anchorT+(now-anchorNow);
  if(cur>=DUR){cur=DUR;render(cur);window.__promoDone=true;
    if(loop){cur=0;anchorT=0;anchorNow=null;window.__promoDone=false;}else{running=false;return;}}
  else render(cur);
  requestAnimationFrame(tick);
}
function play(){if(running)return;if(cur>=DUR){cur=0;window.__promoDone=false;}running=true;anchorT=cur;anchorNow=null;requestAnimationFrame(tick);}
function seek(ms){cur=cl(ms,0,DUR);anchorT=cur;anchorNow=null;window.__promoDone=cur>=DUR;render(cur);}
addEventListener('keydown',function(e){
  if(e.key===' '){e.preventDefault();if(running)running=false;else play();}
  else if(e.key==='ArrowRight')seek(cur+(e.shiftKey?100:1000));
  else if(e.key==='ArrowLeft')seek(cur-(e.shiftKey?100:1000));
  else if(/^[0-7]$/.test(e.key))seek(SCENES[+e.key]);
  else if(e.key==='r'){seek(0);play();}
});

function ready(){
  var ps=[];
  if(document.fonts&&document.fonts.load){
    ['800 20px "Plus Jakarta Sans"','700 20px "Plus Jakarta Sans"','500 12px "Figtree"','600 12px "Figtree"','700 12px "Figtree"','800 12px "Figtree"']
      .forEach(function(f){ps.push(document.fonts.load(f).catch(function(){}));});
    ps.push(document.fonts.ready);
  }
  [].forEach.call(document.images,function(img){
    ps.push(img.complete?Promise.resolve():new Promise(function(r){img.onload=img.onerror=r;}));});
  return Promise.race([Promise.all(ps),new Promise(function(r){setTimeout(r,4000);})]);
}
render(start);
ready().then(function(){
  window.__promoReady=true;
  render(cur);
  if(paused){window.__promoDone=cur>=DUR;return;}
  play();
});
})();
